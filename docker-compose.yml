x-common: &common
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  # Pintu masuk: satu-satunya service yang dipanggil Orkestrasi pusat.
  orchestrator:
    <<: *common
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    image: nlm-k2-orchestrator:latest
    container_name: nlm-k2-orchestrator
    env_file: services/orchestrator/.env
    environment:
      PORT: "8040"
      GUARDRAILS_SERVICE_URL: http://guardrails:8041
      EKSTRAKSI_SERVICE_URL: http://ekstraksi:8042
      STRUCTURING_SERVICE_URL: http://structuring:8043
      SCORING_SERVICE_URL: http://scoring:8044
    ports:
      - "127.0.0.1:8040:8040"
    depends_on:
      - guardrails
      - ekstraksi

  guardrails:
    <<: *common
    build:
      context: .
      dockerfile: services/guardrails/Dockerfile
    image: nlm-k2-guardrails:latest
    container_name: nlm-k2-guardrails
    env_file: services/guardrails/.env
    environment:
      PORT: "8041"
    ports:
      - "127.0.0.1:8041:8041"

  structuring:
    <<: *common
    build:
      context: .
      dockerfile: services/structuring/Dockerfile
    image: nlm-k2-structuring:latest
    container_name: nlm-k2-structuring
    env_file: services/structuring/.env
    environment:
      PORT: "8043"
      SCORING_SERVICE_URL: http://scoring:8044
    ports:
      - "127.0.0.1:8043:8043"
    depends_on:
      - scoring

  scoring:
    <<: *common
    build:
      context: .
      dockerfile: services/scoring/Dockerfile
    image: nlm-k2-scoring:latest
    container_name: nlm-k2-scoring
    env_file: services/scoring/.env
    environment:
      PORT: "8044"
    ports:
      - "127.0.0.1:8044:8044"

  ekstraksi:
    <<: *common
    build:
      context: .
      dockerfile: services/ekstraksi/Dockerfile
    image: nlm-k2-ekstraksi:latest
    container_name: nlm-k2-ekstraksi
    env_file: services/ekstraksi/.env
    environment:
      PORT: "8042"
      STRUCTURING_SERVICE_URL: http://structuring:8043
    ports:
      - "127.0.0.1:8042:8042"
    depends_on:
      - structuring
