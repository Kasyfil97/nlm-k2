openapi: 3.1.0
info:
  title: OCR Kartu Keluarga Scoring API
  description: 'Pipeline step 4 (last) for Indonesian Kartu Keluarga: P(correct) per contract field, after
    fusing the two structuring scores. There is no document score and no approve/reject decision -- the
    threshold belongs to the caller. **Async pipeline:** the structuring service POSTs /v1/scoring/jobs
    and gets 202; this service scores in the background, stores the result, and POSTs the stage callback
    carrying the final result to the orchestrator. /v1/scoring/confidence is the same work, synchronous.
    All endpoints except /health require an X-API-Key header.


    ## Conventions (the same for every nlm-k2 service)


    **Authentication.** Every endpoint except `/health`, `/ready` and `/metrics` requires the header `X-API-Key`.

    A missing or wrong key answers `401`. The services are reachable only from inside the cluster.


    **Envelope.** Every JSON response, success or error, has the same shape:

    `{status_code, status_desc, message, data, errors, request_id}`. `status_code` always equals the HTTP

    status. On success `errors` is null; on error `data` is null.


    **Errors.** `errors` is machine-readable: `VALIDATION_ERROR` for `422`, otherwise the same text as

    `message`. `400` = the request or the document is unusable (do not retry unchanged). `401` = API key.

    `404` = unknown request_id. `409` = request_id already processed (legacy contract only). `422` = a

    field is missing or has the wrong type. `500` = this service or its model failed. `503` = a

    dependency is unreachable, `504` = it did not answer in time (both are safe to retry).


    **request_id.** Minted by the central orchestrator and carried through every stage. Where an endpoint
    has

    no request_id of its own, the `X-Request-ID` request header is used (and echoed in the response header);

    without it the service generates one.


    **Asynchronous stages** (internal: only the orchestrator and the previous stage call them). `POST

    .../jobs` answers `202` immediately and does the work in the background. The outcome is reported by
    a

    callback to the central orchestrator (see *Webhooks*), and can be read at any time with

    `GET .../jobs/{request_id}`, which the orchestrator''s `GET /v1/extract-ocr/{request_id}` combines

    over the three stages. Submitting the same request_id again is idempotent:

    `202` with `duplicate: true`, the work is not repeated, unless the earlier attempt `FAILED` or has
    been

    `PROCESSING` for longer than the job lease (`PIPELINE_JOB_LEASE_SECONDS`, 5 minutes by default: the

    process running it died). A job still running when the service shuts down is reported `FAILED`. Because

    the request was already answered `202`, a problem with the document itself (unreadable file, no text,

    unsupported document type) shows up as a `FAILED` job and callback, not as a `4xx`.

    '
  version: 1.0.0
servers:
- url: /
  description: This host (where this page is served)
- url: http://nlm-k2-scoring.{namespace}.svc.cluster.local:8044
  description: GKE, from inside the release's namespace (the other services of this pipeline)
  variables:
    namespace:
      default: nlm-k2
      description: 'Namespace of the Helm release (deploy/helm/deploy.sh: nlm-k2)'
- url: http://scoring:8044
  description: The Docker Compose network
- url: http://127.0.0.1:8044
  description: Local development
paths:
  /health:
    get:
      tags:
      - Health
      summary: Liveness probe
      description: Says the process is alive and which implementations are active. Never touches a dependency.
        Does not require an API key.
      operationId: getHealth
      responses:
        '200':
          description: The process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: Healthy
                  value:
                    status: healthy
                    version: 1.0.0
                    device: cpu
                    backends:
                      scoring: trust_model
                      storage: postgres
  /ready:
    get:
      tags:
      - Health
      summary: Readiness probe
      description: 'Liveness vs readiness: /health only says the process is alive and never touches a
        dependency (a database blip must not make Kubernetes restart every pod). /ready says whether this
        pod can do its job right now: 200 when every REQUIRED dependency of this service answers, 503
        otherwise, so the pod is taken out of the Service until it recovers. Downstream stages and model
        services are deliberately not checked: their outage is reported per job, not by refusing traffic.
        Does not require an API key.'
      operationId: getReadiness
      responses:
        '200':
          description: Every required dependency answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              examples:
                ready:
                  summary: Ready
                  value:
                    status: ready
                    checks:
                      database: ok
        '503':
          description: A required dependency is unavailable; the pod is taken out of the Service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                status: not_ready
                checks:
                  database: failed
  /metrics:
    get:
      tags:
      - Health
      summary: Prometheus metrics
      description: 'Prometheus text exposition of this process: `http_requests_total` and `http_request_duration_seconds`
        per route template, and for the pipeline stages `pipeline_jobs_total` (by outcome), `pipeline_job_duration_seconds`,
        `pipeline_stale_jobs_reclaimed_total`, `pipeline_outbox_deliveries_total` and the outbox backlog
        gauges (`pipeline_outbox_pending`, `_retrying`, `_dead_letters`, `_oldest_pending_seconds`). Scraped
        inside the cluster; does not require an API key.'
      operationId: getMetrics
      responses:
        '200':
          description: Metrics in the Prometheus text format
          content:
            text/plain:
              schema:
                type: string
  /v1/scoring/jobs:
    post:
      tags:
      - Pipeline
      summary: Hand a structured document to the scoring stage (last)
      description: '**Step 4 of the pipeline, asynchronous, the last stage. Called by the structuring
        service, not by the orchestrator.**


        Records the job (`scoring_jobs`, idempotent per request_id), answers **202 immediately**, then
        in the background: builds the ML team''s scoring payload from the chained guardrails + OCR + structuring
        results, runs the trust model, stores the result (`scoring_results`), and POSTs the `SCORING`
        callback, which carries the **final result** of the request.


        The outcome is two per-field confidences. There is no document-level score and no approve / reject
        decision: thresholds belong to the orchestrator.'
      operationId: submitScoringJob
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoringJobRequest'
        required: true
      responses:
        '202':
          description: The job was accepted (or already existed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
              examples:
                accepted:
                  summary: New job
                  value:
                    status_code: 202
                    status_desc: Accepted
                    message: Accepted
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: SCORING
                      status: PROCESSING
                      duplicate: false
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                duplicate:
                  summary: 'Same request_id sent again: nothing is re-run'
                  value:
                    status_code: 202
                    status_desc: Accepted
                    message: Accepted
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: SCORING
                      status: DONE
                      duplicate: true
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'body.request_id: Field required'
                errors: VALIDATION_ERROR
      security:
      - APIKeyHeader: []
  /v1/scoring/jobs/{request_id}:
    get:
      tags:
      - Pipeline
      summary: Status and result of the scoring stage
      description: 'Status of this stage only and, once `DONE`, the two confidences plus the exact payload
        that was scored. Internal: the orchestrator reads it (while it waits, and for its `GET /v1/extract-ocr/{request_id}`);
        the central orchestrator receives the final result in the callback. Also useful to audit a score.'
      operationId: getScoringJob
      security:
      - APIKeyHeader: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      responses:
        '200':
          description: The job exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoringJobStatusResponse'
              examples:
                done:
                  summary: Finished
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: SCORING
                      created_at: '2026-09-18T04:00:01+00:00'
                      status: DONE
                      result:
                        nomor_kk: 0.9806
                        name_confidence: 0.9948
                        payload:
                          structuring: '{...the §7.3 structuring result, whole...}'
                          guardrail_probability: 0.0287
                          guardrail_verdict: accepted
                          avg_doc_score: 0.814
                          min_doc_score: 0.2822
                          text_regions_count: 177
                      updated_at: '2026-09-18T04:00:01+00:00'
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                failed:
                  summary: Failed
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: SCORING
                      created_at: '2026-09-18T04:00:01+00:00'
                      status: FAILED
                      error_message: 'Unsupported document_type: ktp. Supported: [''kk'']'
                      updated_at: '2026-09-18T04:00:01+00:00'
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No scoring job for this request_id
          content:
            application/json:
              example:
                status_code: 404
                status_desc: Not Found
                message: 'No SCORING job found for request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0'
                errors: 'No SCORING job found for request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0'
                request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'path.request_id: Field required'
                errors: VALIDATION_ERROR
                request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/scoring/outbox:
    get:
      tags:
      - Pipeline
      summary: Backlog of this stage's undelivered callbacks and hand-offs
      description: 'Operational view of the transactional outbox (`PIPELINE_OUTBOX`): how many callbacks
        and hand-offs of this stage are still to be delivered, how old the oldest one is, and how many
        were given up on (dead letters). No other service watches the `pipeline_outbox` table, so this
        is where a monitor should look; the relay also logs a warning when the backlog is older than `PIPELINE_OUTBOX_STALE_AFTER_SECONDS`
        or a dead letter is waiting.'
      operationId: getScoringOutboxStatus
      responses:
        '200':
          description: The backlog of this stage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxStatusResponse'
              examples:
                idle:
                  summary: Nothing waiting
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      enabled: true
                      stage: SCORING
                      pending: 0
                      retrying: 0
                      dead_letters: 0
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                backlog:
                  summary: The orchestrator has been down for a while
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      enabled: true
                      stage: SCORING
                      pending: 12
                      retrying: 12
                      oldest_pending_seconds: 754.3
                      dead_letters: 1
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                disabled:
                  summary: '`PIPELINE_OUTBOX` is off'
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      enabled: false
                      stage: SCORING
                      pending: 0
                      retrying: 0
                      dead_letters: 0
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
      security:
      - APIKeyHeader: []
  /v1/scoring/outbox/release:
    post:
      tags:
      - Pipeline
      summary: Send this stage's dead letters again
      description: 'Puts the dead letters of this stage back in the outbox queue, due immediately, so
        the relay delivers them again: use it after the receiver was fixed (for example the orchestrator''s
        callback contract, or a next stage that was answering 4xx). Optional query `request_id` limits
        it to one request. A message that fails again goes through the same retry and dead-letter rules.
        `409` when `PIPELINE_OUTBOX` is off on this service.'
      operationId: releaseScoringOutbox
      security:
      - APIKeyHeader: []
      parameters:
      - name: request_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
      responses:
        '200':
          description: Dead letters released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxReleaseResponse'
              examples:
                released:
                  summary: One request
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      stage: SCORING
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      released: 1
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                nothing:
                  summary: Nothing to release
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      stage: SCORING
                      released: 0
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The outbox is off on this service
          content:
            application/json:
              example:
                status_code: 409
                status_desc: Conflict
                message: 'PIPELINE_OUTBOX is off: there is no outbox to release'
                errors: 'PIPELINE_OUTBOX is off: there is no outbox to release'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'query.request_id: Input should be a valid string'
                errors: VALIDATION_ERROR
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/scoring/confidence:
    post:
      tags:
      - Scoring
      summary: Per-field confidence from the trust model, synchronous (no job, no callback)
      description: 'P(each extracted field is correct), after fusing the two structuring scores and calibrating.
        Only the **nine contract fields** are scored -- two document fields and seven per household member
        -- not all 26 that structuring extracts: each field needs its own calibrator, and training 26
        of them for 9 numbers anyone reads would be waste. The keys here are the INTERNAL names; the rename
        to the outgoing contract happens in the orchestrator.


        `anggota_keluarga` comes back with exactly as many rows as were sent, in the same order. There
        is no document-level score and no approve/reject decision: the threshold belongs to the caller.'
      operationId: predictConfidence
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfidenceRequest'
        required: true
      responses:
        '200':
          description: P(correct) per contract field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfidenceResponse'
              examples:
                scored:
                  summary: Two members; the second one's occupation was not read, so it scores null
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      document_type: kk
                      fields:
                        nomor_kk: 0.9412
                        nama_kepala_keluarga: 0.8871
                      anggota_keluarga:
                      - nama_lengkap: 0.9702
                        nik: 0.9655
                        pendidikan: 0.841
                        jenis_pekerjaan: 0.7733
                        status_hubungan_dalam_keluarga: 0.9218
                        ayah: 0.8064
                        ibu: 0.7951
                      - nama_lengkap: 0.9333
                        nik: 0.951
                        pendidikan: 0.7126
                        status_hubungan_dalam_keluarga: 0.9047
                        ayah: 0.7702
                        ibu: 0.7588
                      model: kk-trust-mock-v1
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'body.structuring: Field required'
                errors: VALIDATION_ERROR
      security:
      - APIKeyHeader: []
webhooks:
  stageCallback:
    post:
      tags:
      - Callbacks
      summary: Stage status callback (implemented by the orchestrator / gateway)
      description: '**This is a request this service SENDS, not one it accepts.** The orchestrator must
        expose it.


        `POST {ORCHESTRATION_URL}{ORCHESTRATION_CALLBACK_PATH}` (default path `/v1/callbacks/stage`),
        `Content-Type: application/json`.


        **When.** Once per job of `POST /v1/scoring/jobs`, the last callback of a request: `stage: SCORING`
        with `status: DONE` and `result` = the **final result** (fields, per-field confidences, and the
        guardrails result that was submitted), or `status: FAILED` with `error_message` and `result: null`.


        **Expected answer.** Any `2xx`; the body is ignored. `5xx`, a timeout or an unreachable host are
        retried (3 attempts by default, exponential back-off from 0.5 s). A `4xx` is NOT retried. A callback
        that still fails is logged and dropped: the job itself stays `DONE` / `FAILED`, so the orchestrator
        can reconcile with its own `GET /v1/extract-ocr/{request_id}` and should time a request out on
        its own. With `PIPELINE_OUTBOX` the callback is instead queued in the same transaction as the
        result and retried with back-off (up to 5 minutes apart) for up to `PIPELINE_OUTBOX_MAX_AGE_SECONDS`
        (24 h by default); a `4xx`, or that age, makes it a dead letter that stays in the table and is
        counted by `GET .../outbox`.


        **What the receiver must tolerate.** The same callback may arrive more than once (treat it as
        idempotent), and callbacks of different stages come from different services, so they may arrive
        out of order: only ever move a request''s status forward. Reject callbacks whose `X-API-Key` is
        wrong.'
      operationId: stageCallback
      parameters:
      - description: '`ORCHESTRATION_API_KEY` of the sending service; when unset, that service''s own
          `API_KEY`'
        required: true
        schema:
          type: string
          title: X-Api-Key
          description: '`ORCHESTRATION_API_KEY` of the sending service; when unset, that service''s own
            `API_KEY`'
        name: x-api-key
        in: header
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoringStageCallback'
        required: true
      responses:
        '200':
          description: Acknowledged. Any 2xx is accepted and the body is ignored.
          content:
            application/json:
              schema: {}
components:
  schemas:
    ConfidenceRequest:
      properties:
        structuring:
          $ref: '#/components/schemas/StructuringPayload'
          description: The structuring result, whole (§7.3)
        guardrail_probability:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Guardrail Probability
          description: '`document.probability_bad` of the guardrails result -- the RAW model output, not
            the verdict''s confidence. Null when guardrails was skipped, and also when the verdict was
            `unassessable`, which the model must impute rather than read as a number'
          examples:
          - 0.0287
        guardrail_verdict:
          anyOf:
          - type: string
          - type: 'null'
          title: Guardrail Verdict
          description: '`accepted`, `reject` or `unassessable`; null when guardrails was skipped'
        avg_doc_score:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Avg Doc Score
          description: Mean of the OCR box scores; null when there were none
          examples:
          - 0.814
        min_doc_score:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Min Doc Score
          description: Lowest OCR box score; null when there were none
          examples:
          - 0.2822
        text_regions_count:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Text Regions Count
          description: Number of OCR boxes
          examples:
          - 177
      type: object
      required:
      - structuring
      title: ConfidenceRequest
      description: 'Body of the synchronous `POST /v1/scoring/confidence` (§8.4).


        The structuring result is passed whole rather than pre-extracted into per-field signals: a

        Kartu Keluarga has a variable-length member list, so there is no fixed set of signal columns to

        flatten it into, and the model needs the two scores per field anyway.'
    ConfidenceResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          default: 200
          examples:
          - 200
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          default: OK
          examples:
          - OK
        message:
          type: string
          title: Message
          description: Human-readable outcome
          default: Success
          examples:
          - Success
        errors:
          type: 'null'
          title: Errors
          description: Always null on success
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: 'The request_id this response belongs to: the one sent in the form / body / path,
            otherwise the `X-Request-ID` header, otherwise one generated by the service'
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        data:
          $ref: '#/components/schemas/ScoringPayload'
      type: object
      required:
      - data
      title: ConfidenceResponse
    ErrorResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          examples:
          - 400
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          examples:
          - Bad Request
        message:
          type: string
          title: Message
          description: Human-readable cause; safe to log
          examples:
          - Uploaded file is empty
        data:
          type: 'null'
          title: Data
          description: Always null on error
        errors:
          type: string
          title: Errors
          description: Machine-readable cause. `VALIDATION_ERROR` for 422 (branch on this, the message
            names a different field every time); for every other status it repeats `message`
          examples:
          - Uploaded file is empty
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: Present when the error is tied to a known request_id
