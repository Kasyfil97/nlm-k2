openapi: 3.1.0
info:
  title: OCR Kartu Keluarga Guardrails API
  description: 'The image-quality judge of the nlm-k2 Kartu Keluarga pipeline, internal: the orchestrator
    calls `POST /v1/guardrails/check` for every document it receives, and hands one that passes to the
    OCR stage. A Kartu Keluarga is a single image, so the check produces one verdict -- `accepted`, `reject`,
    or `unassessable` when the image could not be judged at all -- and never an HTTP error for the document
    itself. The model runs in this process (`kk_quality`: patch blur CNN + XGBoost + isotonic calibration)
    or in the ML team''s quality service (`remote`). This is the only image-quality gate in the pipeline,
    so `GUARDRAILS_THRESHOLD` is the single lever for refusing a bad photo. All endpoints except /health,
    /ready and /metrics require an X-API-Key header.


    ## Conventions (the same for every nlm-k2 service)


    **Authentication.** Every endpoint except `/health`, `/ready` and `/metrics` requires the header `X-API-Key`.

    A missing or wrong key answers `401`. The services are reachable only from inside the cluster.


    **Envelope.** Every JSON response, success or error, has the same shape:

    `{status_code, status_desc, message, data, errors, request_id}`. `status_code` always equals the HTTP

    status. On success `errors` is null; on error `data` is null.


    **Errors.** `errors` is a stable, machine-readable code; branch on it, not on the wording of `message`.

    The document checks: `EMPTY_FILE`, `UNSUPPORTED_FILE_TYPE`, `UNREADABLE_FILE`, `TOO_MANY_PAGES`,

    `INVALID_FILE_SOURCE`, `FILE_URL_REJECTED` (400), `FILE_TOO_LARGE` (413). Otherwise the code of the
    status:

    `UNAUTHORIZED` (401), `REQUEST_ID_NOT_FOUND` (404, an unknown request_id), `NOT_FOUND` (404, a path
    that does

    not exist), `METHOD_NOT_ALLOWED` (405), `VALIDATION_ERROR` (422), `TOO_MANY_REQUESTS` (429),

    `INTERNAL_SERVER_ERROR` (500), `DOWNSTREAM_UNAVAILABLE` (503), `DOWNSTREAM_TIMEOUT` (504), unless
    an endpoint

    documents a more precise one. Every error also names the service it comes from in `pipeline_last_stage`.

    `400` = the request or the document is unusable (do not retry unchanged). `503` / `504` are safe to
    retry.


    **request_id.** Minted by the central orchestrator and carried through every stage. Where an endpoint
    has

    no request_id of its own, the `X-Request-ID` request header is used (and echoed in the response header);

    without it the service generates one.


    **Asynchronous stages** (internal: only the orchestrator and the previous stage call them). `POST

    .../jobs` answers `202` immediately and does the work in the background. The outcome is reported by
    a

    callback to the central orchestrator (see *Webhooks*), and can be read at any time with

    `GET .../jobs/{request_id}`, which the orchestrator''s `GET /v1/extract-ocr/{request_id}` combines

    over the three stages. Submitting the same request_id again is idempotent:

    `202` with `duplicate: true`, the work is not repeated, unless the earlier attempt `FAILED` or has
    been

    `PROCESSING` for longer than the job lease (`PIPELINE_JOB_LEASE_SECONDS`, 5 minutes by default: the

    process running it died). A job still running when the service shuts down is reported `FAILED`. Because

    the request was already answered `202`, a problem with the document itself (unreadable file, no text,

    unsupported document type) shows up as a `FAILED` job and callback, not as a `4xx`.

    '
  version: 1.0.0
servers:
- url: /
  description: This host (where this page is served)
- url: http://nlm-k2-guardrails.{namespace}.svc.cluster.local:8041
  description: GKE, from inside the release's namespace (the other services of this pipeline)
  variables:
    namespace:
      default: nlm-k2
      description: 'Namespace of the Helm release (deploy/helm/deploy.sh: nlm-k2)'
- url: http://guardrails:8041
  description: The Docker Compose network
- url: http://127.0.0.1:8041
  description: Local development
paths:
  /health:
    get:
      tags:
      - Health
      summary: Liveness probe
      description: Says the process is alive and which implementations are active. Never touches a dependency.
        Does not require an API key.
      operationId: getHealth
      responses:
        '200':
          description: The process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: Healthy
                  value:
                    status: healthy
                    version: 1.0.0
                    device: cpu
                    backends:
                      guardrails: kk_quality
  /ready:
    get:
      tags:
      - Health
      summary: Readiness probe
      description: 'Liveness vs readiness: /health only says the process is alive and never touches a
        dependency (a database blip must not make Kubernetes restart every pod). /ready says whether this
        pod can do its job right now: 200 when every REQUIRED dependency of this service answers, 503
        otherwise, so the pod is taken out of the Service until it recovers. Downstream stages and model
        services are deliberately not checked: their outage is reported per job, not by refusing traffic.
        Does not require an API key.'
      operationId: getReadiness
      responses:
        '200':
          description: Every required dependency answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              examples:
                ready:
                  summary: Ready
                  value:
                    status: ready
                    checks: {}
        '503':
          description: A required dependency is unavailable; the pod is taken out of the Service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                status: not_ready
                checks: {}
  /metrics:
    get:
      tags:
      - Health
      summary: Prometheus metrics
      description: 'Prometheus text exposition of this process: `http_requests_total` and `http_request_duration_seconds`
        per route template, and for the pipeline stages `pipeline_jobs_total` (by outcome), `pipeline_job_duration_seconds`,
        `pipeline_stale_jobs_reclaimed_total`, `pipeline_outbox_deliveries_total` and the outbox backlog
        gauges (`pipeline_outbox_pending`, `_retrying`, `_dead_letters`, `_oldest_pending_seconds`). Scraped
        inside the cluster; does not require an API key.'
      operationId: getMetrics
      responses:
        '200':
          description: Metrics in the Prometheus text format
          content:
            text/plain:
              schema:
                type: string
  /v1/guardrails/check:
    post:
      tags:
      - Guardrails
      summary: 'Judge a Kartu Keluarga image (internal: called by the orchestrator)'
      description: 'Runs the guardrails model on the image and answers a verdict, **without** starting
        anything: no OCR job, no callback. A Kartu Keluarga is one image, so there is one verdict and
        no page list. The model runs in this process (`kk_quality`) or in the ML team''s quality service
        (`remote`, POST /v1/predict/json); the report is the same either way. The orchestrator calls it
        for every `extract-ocr` and forwards `data` unchanged to the OCR stage when `passed`.


        **Always 200 when the document was received**: read `data.passed`. An image the model cannot judge
        is `verdict: "unassessable"` with `probability_bad: null` and `passed: false`, not an error status.
        The 400s below are about the *request*, not about the document: an intake that names neither or
        both of `file` and `file_url`, a refused `file_url`, or a `file_url` while `GUARDRAILS_FETCH_URL=false`.
        A `threshold` outside (0, 1), or one without its `threshold_target`, is 422. Type and size are
        checked by the orchestrator before this endpoint is called.'
      operationId: checkDocument
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_checkDocument'
      responses:
        '200':
          description: The document was judged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardrailReportResponse'
              examples:
                accepted:
                  summary: Accepted
                  value:
                    status_code: 200
                    status_desc: OK
                    message: OK
                    data:
                      passed: true
                      document:
                        verdict: accepted
                        confidence: 0.9713
                        probability_bad: 0.0287
                        threshold_used: 0.5
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                rejected:
                  summary: Rejected
                  value:
                    status_code: 200
                    status_desc: OK
                    message: OK
                    data:
                      passed: false
                      reason: Kualitas gambar terlalu rendah, mohon unggah foto yang lebih jelas
                      document:
                        verdict: reject
                        confidence: 0.8821
                        probability_bad: 0.8821
                        threshold_used: 0.5
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                unassessable:
                  summary: Could not be judged
                  value:
                    status_code: 200
                    status_desc: OK
                    message: OK
                    data:
                      passed: false
                      reason: Gambar tidak dapat dinilai, mohon unggah ulang foto Kartu Keluarga yang
                        utuh
                      document:
                        verdict: unassessable
                        threshold_used: 0.5
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
        '400':
          description: Bad intake
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 400
                status_desc: Bad Request
                message: Send exactly one of file or file_url
                errors: BAD_REQUEST
                pipeline_last_stage: guardrails
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: UNAUTHORIZED
                pipeline_last_stage: guardrails
        '422':
          description: '`threshold` outside (0, 1), not a number, or sent without `threshold_target` (or
            the other way round)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: send threshold and threshold_target together, or neither
                errors: VALIDATION_ERROR
                pipeline_last_stage: guardrails
        '500':
          description: The guardrails model failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 500
                status_desc: Internal Server Error
                message: guardrails model returned an unexpected response
                errors: INTERNAL_SERVER_ERROR
                pipeline_last_stage: guardrails
        '503':
          description: The guardrails model service (`remote`) is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 503
                status_desc: Service Unavailable
                message: guardrails model is unavailable
                errors: DOWNSTREAM_UNAVAILABLE
                pipeline_last_stage: guardrails
        '504':
          description: The guardrails model service (`remote`) did not answer in time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 504
                status_desc: Gateway Timeout
                message: guardrails model timed out after 30.0s
                errors: DOWNSTREAM_TIMEOUT
                pipeline_last_stage: guardrails
      security:
      - APIKeyHeader: []
components:
  schemas:
    Body_checkDocument:
      properties:
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: Echoed in the response; optional
          examples:
          - OCR_9cb01af2-493d-446d-b191-af120333f6d0
        file:
          anyOf:
          - type: string
            contentMediaType: application/octet-stream
          - type: string
          - type: 'null'
          title: File
          description: Kartu Keluarga photo (JPEG, PNG or PDF; of a PDF only page 1 is read). Omit when
            sending file_url.
        file_url:
          anyOf:
          - type: string
          - type: 'null'
          title: File Url
          description: 'URL this service fetches the photo from (e.g. a presigned MinIO GET). Omit when
            uploading file. The host must be listed in the service''s `FILE_URL_ALLOWED_HOSTS`: an EMPTY
            list denies every URL rather than allowing public ones. https only, redirects are not followed,
            and a host that resolves to a private or loopback address is refused even when it is listed.'
        threshold:
          anyOf:
          - type: number
            exclusiveMaximum: 1.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Threshold
          description: Threshold for this request only, overriding every configured source; sent with
            `threshold_target`, or neither (as in nilam). Strictly between 0 and 1. Ignored by the `remote`
            backend, which judges under its own
          examples:
          - 0.5
        threshold_target:
          anyOf:
          - type: string
            enum:
            - accept
            - reject
          - type: 'null'
          title: Threshold Target
          description: 'The side `threshold` applies to. `reject`: rejected when `probability_bad >= threshold`.
            `accept`: accepted when `1 - probability_bad >= threshold` -- the KK model gives one probability,
            so the accept side is its complement'
          examples:
          - accept
      type: object
      title: Body_checkDocument
    DocumentResult:
      properties:
        verdict:
          type: string
          enum:
          - accepted
          - reject
          - unassessable
          title: Verdict
          description: '`reject` when `probability_bad` reaches `threshold_used`, `accepted` below it,
            and `unassessable` when the model could not judge the image at all (undecodable, not an image,
            or dimensions outside the range it was trained on). `unassessable` is a verdict and not an
            error: this endpoint always answers 200'
          examples:
          - accepted
        confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Confidence
          description: 'Confidence in the verdict: `probability_bad` when rejected, `1 - probability_bad`
            when accepted, null when unassessable'
          examples:
          - 0.9713
        probability_bad:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Probability Bad
          description: 'Raw model output: the probability that the image is bad. Travels unchanged to
            scoring as the `guardrail_probability` feature. Null when the verdict is `unassessable`'
          examples:
          - 0.0287
        threshold_used:
          anyOf:
          - type: number
            exclusiveMaximum: 1.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Threshold Used
          description: 'The threshold in force for this request: the `threshold` form field, else the
            central orchestrator''s (`GUARDRAILS_THRESHOLD_URL`), else `GUARDRAILS_THRESHOLD`, else the
            value stored with the weights, else 0.5. Echoed because it can change without a deploy here.
            Null with the `remote` backend when that service does not state its own'
          examples:
          - 0.5
        threshold_target:
          anyOf:
          - type: string
            enum:
            - accept
            - reject
          - type: 'null'
          title: Threshold Target
          description: 'The side `threshold_used` applied to: `reject` (rejected when `probability_bad
            >= threshold_used`) or `accept` (accepted when `1 - probability_bad >= threshold_used`). `reject`
            unless the request sent `threshold_target`. Null with the `remote` backend'
          examples:
          - reject
      type: object
      required:
      - verdict
      - confidence
      - probability_bad
      title: DocumentResult
    ErrorResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          examples:
          - 400
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          examples:
          - Bad Request
        message:
          type: string
          title: Message
          description: Human-readable cause; safe to log
          examples:
          - Uploaded file is empty
        data:
          type: 'null'
          title: Data
          description: Always null on error
        errors:
          type: string
          title: Errors
          description: 'Stable, machine-readable cause (e.g. `EMPTY_FILE`, `UNAUTHORIZED`, `VALIDATION_ERROR`):
            branch on this, never on the wording of `message`'
          examples:
          - EMPTY_FILE
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: Present when the error is tied to a known request_id
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        pipeline_last_stage:
          anyOf:
          - type: string
          - type: 'null'
          title: Pipeline Last Stage
          description: 'The service the error comes from: this one (`orchestrator`, `guardrails`, `extraction`,
            `structuring`, `scoring`), or the pipeline service it called when that one failed'
          examples:
          - orchestrator
      type: object
      required:
      - status_code
      - status_desc
      - message
      - errors
      title: ErrorResponse
      description: Every error response.
    GuardrailReport:
      properties:
        passed:
          type: boolean
          title: Passed
          description: 'true: the document may go on to the OCR stage. false: stop, and answer the client
            with `reason`'
          examples:
          - true
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Why the document was stopped, in Indonesian and shown to the end user as it stands;
            null when `passed`. The model is binary and judges the image as a whole, so the reason cannot
            say which part is wrong -- only whether the quality was too low or the image could not be
            judged at all
          examples:
          - null
        document:
          $ref: '#/components/schemas/DocumentResult'
      type: object
      required:
      - passed
      - document
      title: GuardrailReport
    GuardrailReportResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          default: 200
          examples:
          - 200
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          default: OK
          examples:
          - OK
        message:
          type: string
          title: Message
          description: Human-readable outcome
          default: OK
          examples:
          - OK
        errors:
          type: 'null'
          title: Errors
          description: Always null on success
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: 'The request_id this response belongs to: the one sent in the form / body / path,
            otherwise the `X-Request-ID` header, otherwise one generated by the service'
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        data:
          $ref: '#/components/schemas/GuardrailReport'
      type: object
      required:
      - data
      title: GuardrailReportResponse
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          description: Always `healthy` while the process is alive
          examples:
          - healthy
        version:
          type: string
          title: Version
          description: Service version
          examples:
          - 1.0.0
        device:
          type: string
          title: Device
          description: Where this service computes
          examples:
          - cpu
        backends:
          additionalProperties:
            type: string
          type: object
          title: Backends
          description: Active implementation per concern (model backend, storage). Useful to confirm a
            deployment
          examples:
          - extraction: paddle
            storage: postgres
      type: object
      required:
      - status
      - version
      - device
      - backends
      title: HealthResponse
      description: '`GET /health`.'
    ReadyResponse:
      properties:
        status:
          type: string
          enum:
          - ready
          - not_ready
          title: Status
          description: '`ready` (HTTP 200) when every check is `ok`, else `not_ready` (HTTP 503)'
          examples:
          - ready
        checks:
          additionalProperties:
            type: string
            enum:
            - ok
            - failed
          type: object
          title: Checks
          description: One entry per REQUIRED dependency of this service; empty when it has none
          examples:
          - database: ok
      type: object
      required:
      - status
      - checks
      title: ReadyResponse
      description: '`GET /ready`.'
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: API key for this service
      in: header
      name: X-API-Key
tags:
- name: Guardrails
  description: 'The guardrails check (internal: called by the orchestrator)'
- name: Health
  description: Liveness and readiness probes; no API key
