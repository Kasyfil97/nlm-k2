[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ty.environment]
root = ["."]
extra-paths = [".", "../../libs/ocr_common"]

[tool.ty.rules]
# `app/config.py` dan `app/services/document_checks.py` mengimpor `fitz` di dalam fungsi dan
# menandainya `ty: ignore[unresolved-import]`. Apakah ignore itu TERPAKAI bergantung pada
# lingkungan: `requirements-dev.txt` memasang PyMuPDF, jadi di CI modulnya resolve dan ignore-nya
# jadi "tidak terpakai" -- dan `ty` keluar dengan kode bukan-nol atas sebuah warning. Tanpa baris
# ini gerbangnya hanya bisa hijau di salah satu lingkungan, dan yang merah justru CI.
unused-ignore-comment = "ignore"

[tool.pyrefly]
search-path = [".", "../../libs/ocr_common"]

[tool.pyrefly.errors]
# Pydantic models narrow a field in a subclass (`stage: Literal["OCR"]` over `stage: str`); that is the
# intended schema, not an unsafe override.
bad-override-mutable-attribute = false
# yaml / openpyxl ship no type stubs; the libraries work, only their types are unknown.
untyped-import = false
# str()/int() around data from JSON or FastAPI (Any at runtime) are deliberate.
unnecessary-type-conversion = false
