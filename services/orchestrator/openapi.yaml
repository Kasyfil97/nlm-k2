openapi: 3.1.0
info:
  title: OCR Kartu Keluarga Orchestrator API
  description: 'Entry point of the OCR Kartu Keluarga pipeline, and the only service the central orchestrator
    calls. `POST /v1/extract-ocr` checks the file, has the guardrails service judge it, hands a document
    that passes to the OCR stage (extraction, which chains to structuring and scoring), and waits up to
    `PIPELINE_WAIT_SECONDS` for the pipeline: 200 with the final result, or 202 while it is still running.
    `GET /v1/extract-ocr/{request_id}` answers the same contract for a request at any later time. This
    service stores nothing: the stages keep the jobs, and they send the result callback. All endpoints
    except /health, /ready and /metrics require an X-API-Key header, and are rate limited per caller (`RATE_LIMIT_REQUESTS`
    per `RATE_LIMIT_WINDOW_SECONDS`, 429 with `Retry-After` beyond that).


    ## Conventions (the same for every nlm-k2 service)


    **Authentication.** Every endpoint except `/health`, `/ready` and `/metrics` requires the header `X-API-Key`.

    A missing or wrong key answers `401`. The services are reachable only from inside the cluster.


    **Envelope.** Every JSON response, success or error, has the same shape:

    `{status_code, status_desc, message, data, errors, request_id}`. `status_code` always equals the HTTP

    status. On success `errors` is null; on error `data` is null.


    **Errors.** `errors` is a stable, machine-readable code; branch on it, not on the wording of `message`.

    The document checks: `EMPTY_FILE`, `UNSUPPORTED_FILE_TYPE`, `UNREADABLE_FILE`, `TOO_MANY_PAGES`,

    `INVALID_FILE_SOURCE`, `FILE_URL_REJECTED` (400), `FILE_TOO_LARGE` (413). Otherwise the code of the
    status:

    `UNAUTHORIZED` (401), `REQUEST_ID_NOT_FOUND` (404, an unknown request_id), `NOT_FOUND` (404, a path
    that does

    not exist), `METHOD_NOT_ALLOWED` (405), `VALIDATION_ERROR` (422), `TOO_MANY_REQUESTS` (429),

    `INTERNAL_SERVER_ERROR` (500), `DOWNSTREAM_UNAVAILABLE` (503), `DOWNSTREAM_TIMEOUT` (504), unless
    an endpoint

    documents a more precise one. Every error also names the service it comes from in `pipeline_last_stage`.

    `400` = the request or the document is unusable (do not retry unchanged). `503` / `504` are safe to
    retry.


    **request_id.** Minted by the central orchestrator and carried through every stage. Where an endpoint
    has

    no request_id of its own, the `X-Request-ID` request header is used (and echoed in the response header);

    without it the service generates one.


    **Asynchronous stages** (internal: only the orchestrator and the previous stage call them). `POST

    .../jobs` answers `202` immediately and does the work in the background. The outcome is reported by
    a

    callback to the central orchestrator (see *Webhooks*), and can be read at any time with

    `GET .../jobs/{request_id}`, which the orchestrator''s `GET /v1/extract-ocr/{request_id}` combines

    over the three stages. Submitting the same request_id again is idempotent:

    `202` with `duplicate: true`, the work is not repeated, unless the earlier attempt `FAILED` or has
    been

    `PROCESSING` for longer than the job lease (`PIPELINE_JOB_LEASE_SECONDS`, 5 minutes by default: the

    process running it died). A job still running when the service shuts down is reported `FAILED`. Because

    the request was already answered `202`, a problem with the document itself (unreadable file, no text,

    unsupported document type) shows up as a `FAILED` job and callback, not as a `4xx`.

    '
  version: 1.0.0
servers:
- url: /
  description: This host (where this page is served)
- url: http://nlm-k2.{namespace}.svc.cluster.local:8040
  description: 'GKE, from another namespace: the entry Service (the central orchestrator / gateway)'
  variables:
    namespace:
      default: nlm-k2
      description: 'Namespace of the Helm release (deploy/helm/deploy.sh: nlm-k2)'
- url: http://nlm-k2-orchestrator.{namespace}.svc.cluster.local:8040
  description: GKE, from inside the release's namespace (the other services of this pipeline)
  variables:
    namespace:
      default: nlm-k2
      description: 'Namespace of the Helm release (deploy/helm/deploy.sh: nlm-k2)'
- url: http://orchestrator:8040
  description: The Docker Compose network
- url: http://127.0.0.1:8040
  description: Local development
paths:
  /health:
    get:
      tags:
      - Health
      summary: Liveness probe
      description: Says the process is alive and which implementations are active. Never touches a dependency.
        Does not require an API key.
      operationId: getHealth
      responses:
        '200':
          description: The process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: Healthy
                  value:
                    status: healthy
                    version: 1.0.0
                    device: cpu
                    backends: {}
  /ready:
    get:
      tags:
      - Health
      summary: Readiness probe
      description: 'Liveness vs readiness: /health only says the process is alive and never touches a
        dependency (a database blip must not make Kubernetes restart every pod). /ready says whether this
        pod can do its job right now: 200 when every REQUIRED dependency of this service answers, 503
        otherwise, so the pod is taken out of the Service until it recovers. Downstream stages and model
        services are deliberately not checked: their outage is reported per job, not by refusing traffic.
        Does not require an API key.'
      operationId: getReadiness
      responses:
        '200':
          description: Every required dependency answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              examples:
                ready:
                  summary: Ready
                  value:
                    status: ready
                    checks: {}
        '503':
          description: A required dependency is unavailable; the pod is taken out of the Service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                status: not_ready
                checks: {}
  /metrics:
    get:
      tags:
      - Health
      summary: Prometheus metrics
      description: 'Prometheus text exposition of this process: `http_requests_total` and `http_request_duration_seconds`
        per route template, and for the pipeline stages `pipeline_jobs_total` (by outcome), `pipeline_job_duration_seconds`,
        `pipeline_stale_jobs_reclaimed_total`, `pipeline_outbox_deliveries_total` and the outbox backlog
        gauges (`pipeline_outbox_pending`, `_retrying`, `_dead_letters`, `_oldest_pending_seconds`). Scraped
        inside the cluster; does not require an API key.'
      operationId: getMetrics
      responses:
        '200':
          description: Metrics in the Prometheus text format
          content:
            text/plain:
              schema:
                type: string
  /v1/extract-ocr:
    post:
      tags:
      - Extract OCR
      summary: Judge a document, run the pipeline, answer with the OCR result or 202
      description: '**The call the central orchestrator makes.** Checks the file, has the guardrails service
        judge it, hands it to the OCR stage when it passes, then waits for OCR -> structuring -> scoring
        for up to `PIPELINE_WAIT_SECONDS` (30 s by default), counted from when this request arrived. The
        response follows the central orchestrator''s `extract-ocr` contract ("Finished" meaning finished
        within the wait):


        | Outcome | HTTP | `data` | `guardrails` | `errors` | `pipeline_last_stage` |

        |---|---|---|---|---|---|

        | Finished | 200 | the fields | `0`, or the accepted probability without a guardrails threshold
        | null | null |

        | Still running | 202 | null | null | null | null |

        | Rejected by the guardrails model | 400 | null | `1` | `DOWNSTREAM_VALIDATION_ERROR` | `guardrails`
        |

        | Rejected by the KK validity gate | 400 | null | `1` | `DOWNSTREAM_VALIDATION_ERROR` | `structuring`
        |

        | A stage failed | 422 | null | as on 200 | `OCR_FAILED`, `STRUCTURING_FAILED` or `SCORING_FAILED`
        | the service that failed |


        The HTTP status (also in `status_code`) says where the request is: 200 finished, 202 still running,
        4xx / 5xx failed or refused.


        `pipeline_last_stage` is null on a success answer (200, 202) and names the service an error comes
        from: a pipeline service as `pipeline_name_sequence` names it (`guardrails`, `extraction`, `structuring`,
        `scoring`), also on a 400 / 500 / 503 / 504 from calling one of them, or `orchestrator` when this
        service refused the request itself before calling any (API key, file checks, `pipeline_name_sequence`,
        thresholds, an unknown request_id).


        `data` holds NINE fields: `no_kk`, `nama_kepala_keluarga`, and `anggota_keluarga[]` with seven
        per member. Structuring extracts 11 document fields and 15 per member; only these leave, and the
        rest stay readable through `GET /v1/structuring/jobs/{request_id}`. Each is `{value, confidence}`,
        as in nilam: `value` is empty when not found -- never null -- and `confidence` is `1` when the
        trust model''s probability that the value is exactly correct reaches the field''s threshold in
        `column_confidence_threshold` (its own key, or `all_field`), else `0`; a field without one (left
        out or null) gets that probability itself, a float. An unreadable threshold is `422` `INVALID_THRESHOLD`
        and nothing runs.


        **Rejected by the KK validity gate**: the only content gate in the pipeline, and it lives at structuring.
        Three rules, first match wins: no readable text boxes at all; the KK number missing; or no member
        with both a NIK and a name. `message` is the gate''s Indonesian reason. A rejected document is
        still a `DONE` job whose result stays readable at `GET /v1/structuring/jobs/{request_id}`.


        **Refused before anything runs** (plain error envelope, no `guardrails`): a document above `MAX_UPLOAD_BYTES`
        (5 MB by default) answers `413`, and a PDF with more than `MAX_DOCUMENT_PAGES` (2) pages answers
        `400`. Both carry an Indonesian `message` the client can show as is. JPEG, PNG and PDF are accepted;
        of a PDF only the first page is judged and read.


        **Which services run.** `pipeline_name_sequence` names them, in order, from `guardrails`, `extraction`,
        `structuring`, `scoring`: guardrails may be left out at the front and the end cut off, but nothing
        in the middle may be skipped and the order may not change (else `422` `INVALID_PIPELINE_SEQUENCE`
        and nothing runs). Omitted: all four. The last one ends the request and its result is `data`,
        as it is: the guardrails report, the OCR result, the structuring result, or the nine fields after
        scoring. Without `guardrails` the file checks above still run and the KK validity gate still rejects;
        the trust model gets no guardrails probability and works with that input missing.


        On 202 the result arrives by callback (sent by the pipeline stages), and can be read with `GET
        /v1/extract-ocr/{request_id}`. Give this call an HTTP timeout well above `PIPELINE_WAIT_SECONDS`
        (e.g. +15 s) to cover a slow guardrails check or hand-off.


        Send `request_id` plus the document as `file`, or as `file_url`; exactly one of the two. A `file_url`
        is downloaded here for the guardrails check, and the URL itself (not the bytes) is handed to the
        OCR stage, which downloads it again, also when it re-runs a job left behind by a dead process:
        the URL must stay valid for longer than the job lease. The raw guardrails report (`probability_bad`
        and the threshold it was compared against) is not part of this response: it travels down the pipeline
        and comes back in the SCORING callback.


        **Idempotency.** The same request_id again re-runs the guardrails check, but the pipeline does
        not run twice unless the earlier OCR attempt `FAILED` or outlived the job lease (`PIPELINE_JOB_LEASE_SECONDS`);
        a request_id that already finished answers again with its stored outcome.'
      operationId: extractOcr
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_extractOcr'
        required: true
      responses:
        '200':
          description: Accepted and finished within the wait
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              examples:
                completed:
                  summary: The OCR result
                  value:
                    status_code: 200
                    status_desc: OK
                    message: OCR extraction completed successfully
                    data:
                      no_kk:
                        value: '9901012609260001'
                        confidence: 1
                      nama_kepala_keluarga:
                        value: BUDI SANTOSO
                        confidence: 1
                      anggota_keluarga:
                      - nama_lengkap:
                          value: BUDI SANTOSO
                          confidence: 1
                        nik:
                          value: '9901011203850001'
                          confidence: 1
                        pendidikan:
                          value: S1
                          confidence: 1
                        jenis_pekerjaan:
                          value: KARYAWAN SWASTA
                          confidence: 1
                        status_hubungan_dalam_rumah_tangga:
                          value: KEPALA KELUARGA
                          confidence: 1
                        ayah:
                          value: SUTRISNO
                          confidence: 1
                        ibu:
                          value: SITI AMINAH
                          confidence: 0
                      - nama_lengkap:
                          value: SITI NURHALIZA
                          confidence: 0
                        nik:
                          value: '9901015506880002'
                          confidence: 1
                        pendidikan:
                          value: SLTA/SEDERAJAT
                          confidence: 0
                        jenis_pekerjaan:
                          value: MENGURUS RUMAH TANGGA
                          confidence: 0
                        status_hubungan_dalam_rumah_tangga:
                          value: ISTRI
                          confidence: 0
                        ayah:
                          value: AHMAD DAHLAN
                          confidence: 1
                        ibu:
                          value: RATNA SARI
                          confidence: 0
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                    guardrails: 0
        '202':
          description: 'Accepted, but still running when the wait ran out: the result follows by callback'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              examples:
                processing:
                  summary: Still processing
                  value:
                    status_code: 202
                    status_desc: Accepted
                    message: OCR job accepted; still processing
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
        '400':
          description: 'Rejected by the guardrails model or by the KK validity gate (`DOWNSTREAM_VALIDATION_ERROR`,
            `guardrails: 1`), a PDF above `MAX_DOCUMENT_PAGES` pages (`Jumlah halaman melebihi batas,
            pastikan hanya mengunggah foto Kartu Keluarga`), or a bad file / intake (empty, unsupported
            type, unreadable, `file_url` refused)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              example:
                status_code: 400
                status_desc: Bad Request
                message: Gambar terlalu buram untuk diproses, mohon unggah ulang foto Kartu Keluarga
                errors: DOWNSTREAM_VALIDATION_ERROR
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: guardrails
                guardrails: 1
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: UNAUTHORIZED
                pipeline_last_stage: orchestrator
        '429':
          description: The caller went over `RATE_LIMIT_REQUESTS` per `RATE_LIMIT_WINDOW_SECONDS`. `Retry-After`
            says how many seconds to wait. The limit is counted per API key, per process
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 429
                status_desc: Too Many Requests
                message: Terlalu banyak permintaan, silakan coba lagi beberapa saat lagi
                errors: TOO_MANY_REQUESTS
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: orchestrator
        '413':
          description: The document exceeds `MAX_UPLOAD_BYTES` (5 MB by default); nothing was started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 413
                status_desc: Payload Too Large
                message: Ukuran dokumen melebihi batas 5 MB, pastikan hanya mengunggah foto Kartu Keluarga
                errors: FILE_TOO_LARGE
                pipeline_last_stage: orchestrator
        '422':
          description: A pipeline stage failed within the wait (`OCR_FAILED`, `STRUCTURING_FAILED`, `SCORING_FAILED`;
            `message` says why), `pipeline_name_sequence` is not a valid sequence (`INVALID_PIPELINE_SEQUENCE`),
            a threshold cannot be read (`INVALID_THRESHOLD`), or a required field is missing (`VALIDATION_ERROR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'structuring stage failed: parser raised on an unexpected layout'
                errors: STRUCTURING_FAILED
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: structuring
                guardrails: 0
        '500':
          description: The guardrails or extraction service failed, or answered in an unexpected shape
            (`DOWNSTREAM_SERVER_ERROR`); `pipeline_last_stage` names it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              example:
                status_code: 500
                status_desc: Internal Server Error
                message: guardrails service returned an unexpected response
                errors: DOWNSTREAM_SERVER_ERROR
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: guardrails
        '503':
          description: The guardrails service, its model, or the extraction service is unreachable (`DOWNSTREAM_UNAVAILABLE`);
            nothing was started. `pipeline_last_stage` names it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              example:
                status_code: 503
                status_desc: Service Unavailable
                message: extraction service is unavailable
                errors: DOWNSTREAM_UNAVAILABLE
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: extraction
        '504':
          description: The guardrails service, its model, or the extraction service did not answer in
            time (`DOWNSTREAM_TIMEOUT`); `pipeline_last_stage` names it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              example:
                status_code: 504
                status_desc: Gateway Timeout
                message: extraction service timed out after 10.0s
                errors: DOWNSTREAM_TIMEOUT
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: extraction
      security:
      - APIKeyHeader: []
  /v1/extract-ocr/{request_id}:
    get:
      tags:
      - Extract OCR
      summary: 'Where a request is now: the extract-ocr answer, without waiting'
      description: 'Reads the jobs of `request_id` once each, in pipeline order, up to the last service
        of the `pipeline_name_sequence` stored with its extraction job, and answers in the same contract
        as `POST /v1/extract-ocr` ("Finished" meaning finished by now):


        | Outcome | HTTP | `data` | `guardrails` | `errors` | `pipeline_last_stage` |

        |---|---|---|---|---|---|

        | Finished | 200 | the fields | `0`, or the accepted probability without a guardrails threshold
        | null | null |

        | Still running | 202 | null | null | null | null |

        | Rejected by the guardrails model | 400 | null | `1` | `DOWNSTREAM_VALIDATION_ERROR` | `guardrails`
        |

        | Rejected by the KK validity gate | 400 | null | `1` | `DOWNSTREAM_VALIDATION_ERROR` | `structuring`
        |

        | A stage failed | 422 | null | as on 200 | `OCR_FAILED`, `STRUCTURING_FAILED` or `SCORING_FAILED`
        | the service that failed |


        The HTTP status (also in `status_code`) says where the request is: 200 finished, 202 still running,
        4xx / 5xx failed or refused.


        `pipeline_last_stage` is null on a success answer (200, 202) and names the service an error comes
        from: a pipeline service as `pipeline_name_sequence` names it (`guardrails`, `extraction`, `structuring`,
        `scoring`), also on a 400 / 500 / 503 / 504 from calling one of them, or `orchestrator` when this
        service refused the request itself before calling any (API key, file checks, `pipeline_name_sequence`,
        thresholds, an unknown request_id).


        Use it for a request that was answered `202`, e.g. when a callback did not arrive.


        **No stage job.** A request that never reached a stage is answered from its last guardrails verdict
        (`nilam_guardrails_results`), as its POST was: `400` when guardrails rejected it, `200` with the
        report as `data` when guardrails was its only service. **404** otherwise: refused before the check,
        still being judged, passed but its hand-off to extraction failed, or no verdict kept (no `DATABASE_URL`).


        **Limitation.** A hand-off between two stages that failed for good (its retries ran out, or it
        became a dead letter in the outbox) leaves the next stage without a job, so this endpoint keeps
        answering `202` for it. The `FAILED` callback and the central orchestrator''s own tables carry
        that final state; this endpoint only reads the stages'' jobs.'
      operationId: getExtractOcr
      security:
      - APIKeyHeader: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      responses:
        '200':
          description: Finished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              examples:
                completed:
                  summary: The OCR result
                  value:
                    status_code: 200
                    status_desc: OK
                    message: OCR extraction completed successfully
                    data:
                      no_kk:
                        value: '9901012609260001'
                        confidence: 1
                      nama_kepala_keluarga:
                        value: BUDI SANTOSO
                        confidence: 1
                      anggota_keluarga:
                      - nama_lengkap:
                          value: BUDI SANTOSO
                          confidence: 1
                        nik:
                          value: '9901011203850001'
                          confidence: 1
                        pendidikan:
                          value: S1
                          confidence: 1
                        jenis_pekerjaan:
                          value: KARYAWAN SWASTA
                          confidence: 1
                        status_hubungan_dalam_rumah_tangga:
                          value: KEPALA KELUARGA
                          confidence: 1
                        ayah:
                          value: SUTRISNO
                          confidence: 1
                        ibu:
                          value: SITI AMINAH
                          confidence: 0
                      - nama_lengkap:
                          value: SITI NURHALIZA
                          confidence: 0
                        nik:
                          value: '9901015506880002'
                          confidence: 1
                        pendidikan:
                          value: SLTA/SEDERAJAT
                          confidence: 0
                        jenis_pekerjaan:
                          value: MENGURUS RUMAH TANGGA
                          confidence: 0
                        status_hubungan_dalam_rumah_tangga:
                          value: ISTRI
                          confidence: 0
                        ayah:
                          value: AHMAD DAHLAN
                          confidence: 1
                        ibu:
                          value: RATNA SARI
                          confidence: 0
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                    guardrails: 0
        '202':
          description: Still running
          content:
            application/json:
              examples:
                processing:
                  summary: Still processing
                  value:
                    status_code: 202
                    status_desc: Accepted
                    message: OCR job accepted; still processing
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
        '400':
          description: 'Rejected by the KK validity gate or, read from nilam_guardrails_results, by the
            guardrails model (`DOWNSTREAM_VALIDATION_ERROR`, `guardrails: 1`)'
          content:
            application/json:
              example:
                status_code: 400
                status_desc: Bad Request
                message: Dokumen tidak dikenali sebagai Kartu Keluarga atau hasil extraction tidak lengkap
                errors: DOWNSTREAM_VALIDATION_ERROR
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: guardrails
                guardrails: 1
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: UNAUTHORIZED
                pipeline_last_stage: orchestrator
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: The caller went over `RATE_LIMIT_REQUESTS` per `RATE_LIMIT_WINDOW_SECONDS`. `Retry-After`
            says how many seconds to wait. The limit is counted per API key, per process
          content:
            application/json:
              example:
                status_code: 429
                status_desc: Too Many Requests
                message: Terlalu banyak permintaan, silakan coba lagi beberapa saat lagi
                errors: TOO_MANY_REQUESTS
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: orchestrator
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No stage has a job for this request_id and no guardrails verdict answers for it
            (not submitted yet, refused before the check, or its hand-off to extraction failed)
          content:
            application/json:
              example:
                status_code: 404
                status_desc: Not Found
                message: No request found for request_id OCR_9cb01af2-493d-446d-b191-af120333f6d0
                errors: REQUEST_ID_NOT_FOUND
                pipeline_last_stage: orchestrator
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: A pipeline stage failed (`OCR_FAILED`, `STRUCTURING_FAILED`, `SCORING_FAILED`)
          content:
            application/json:
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'structuring stage failed: parser raised on an unexpected layout'
                errors: STRUCTURING_FAILED
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: structuring
                guardrails: 0
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
        '500':
          description: A stage answered in an unexpected shape, or refused this service (e.g. a wrong
            API key)
          content:
            application/json:
              example:
                status_code: 500
                status_desc: Internal Server Error
                message: 'structuring service error (401): Invalid or missing API key'
                errors: DOWNSTREAM_SERVER_ERROR
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: structuring
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
        '503':
          description: A stage service is unreachable
          content:
            application/json:
              example:
                status_code: 503
                status_desc: Service Unavailable
                message: structuring service is unavailable
                errors: DOWNSTREAM_UNAVAILABLE
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: structuring
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
        '504':
          description: A stage service did not answer in time
          content:
            application/json:
              example:
                status_code: 504
                status_desc: Gateway Timeout
                message: structuring service timed out after 10.0s
                errors: DOWNSTREAM_TIMEOUT
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: structuring
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
components:
  schemas:
    Body_extractOcr:
      properties:
        request_id:
          type: string
          title: Request Id
          description: request_id minted by the central orchestrator
          examples:
          - OCR_9cb01af2-493d-446d-b191-af120333f6d0
        file:
          anyOf:
          - type: string
            format: binary
          - type: string
          - type: 'null'
          title: File
          description: Kartu Keluarga photo (JPEG, PNG or PDF; of a PDF only page 1 is read). Omit when
            sending file_url.
        file_url:
          anyOf:
          - type: string
          - type: 'null'
          title: File Url
          description: 'URL this service fetches the photo from (e.g. a presigned MinIO GET). Omit when
            uploading file. The host must be listed in the service''s `FILE_URL_ALLOWED_HOSTS`: an EMPTY
            list denies every URL rather than allowing public ones. https only, redirects are not followed,
            and a host that resolves to a private or loopback address is refused even when it is listed.'
        pipeline_name_sequence:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Pipeline Name Sequence
          description: 'The services to run, in order: `guardrails`, `extraction`, `structuring`, `scoring`;
            guardrails optional at the front, the end may be cut off, nothing skipped in the middle. Repeated
            form fields, a comma-separated string, or one JSON array string. Omitted or blank: all four.
            The last one''s result is `data`, as it is'
          examples:
          - - guardrails
            - extraction
            - structuring
            - scoring
        guardrails_confidence_threshold:
          anyOf:
          - type: string
          - type: 'null'
          title: Guardrails Confidence Threshold
          description: 'Guardrails threshold for this document, a JSON object string `{"acc_rej": 0.8}`
            with the value between 0 and 1 (exclusive). Applies to the rejected side. Omitted, empty,
            `{}`, or only null values (`{"acc_rej": null}`, `{"guardrails": null}`): no threshold applies
            -- the document passes guardrails, the answer''s `guardrails` is the accepted probability
            (`1 - probability_bad`), and `probability_bad` travels on to scoring. A number under any key
            but `acc_rej` answers 422'
          examples:
          - '{"acc_rej": 0.8}'
        column_confidence_threshold:
          anyOf:
          - type: string
          - type: 'null'
          title: Column Confidence Threshold
          description: 'Per field, from the central orchestrator: the trust model''s probability that
            the field''s value is correct must reach it for the field''s `confidence` to be `1` (else
            `0`). Keys are the contract names: `no_kk`, `nama_kepala_keluarga`, and the seven member fields
            (`nama_lengkap`, `nik`, `pendidikan`, `jenis_pekerjaan`, `status_hubungan_dalam_rumah_tangga`,
            `ayah`, `ibu`), a member field''s threshold applying to every member. `all_field` sets one
            threshold for every field; a key for a single field overrides it. A field without a threshold
            (left out or null, the whole map omitted, or `all_field` null) gets the trust model''s probability
            itself as `confidence`, a float from 0 to 1 (0 when there is no value); a field''s own null
            wins over `all_field`. A number under an unknown key is refused. A JSON object string'
          examples:
          - '{"all_field": 0.8}'
      type: object
      required:
      - request_id
      title: Body_extractOcr
    ContractField:
      properties:
        value:
          type: string
          title: Value
          description: The value read; `""` when the field was not found -- never null, and the object
            itself is never replaced by null
          default: ''
          examples:
          - '3273012345678901'
        confidence:
          anyOf:
          - type: integer
          - type: number
          title: Confidence
          description: 'With a threshold for this field in the request''s `column_confidence_threshold`
            (its own key or `all_field`): 1 when the trust model''s probability that this value is exactly
            correct reaches it, else 0 (also when there is no value), as in nilam. **Without a threshold**:
            that probability itself, a float from 0 to 1 as the model gave it (0 when there is no value)'
          examples:
          - 1
          - 0.9731
          ge: 0
          le: 1
      type: object
      required:
      - confidence
      title: ContractField
    ErrorResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          examples:
          - 400
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          examples:
          - Bad Request
        message:
          type: string
          title: Message
          description: Human-readable cause; safe to log
          examples:
          - Uploaded file is empty
        data:
          type: 'null'
          title: Data
          description: Always null on error
        errors:
          type: string
          title: Errors
          description: 'Stable, machine-readable cause (e.g. `EMPTY_FILE`, `UNAUTHORIZED`, `VALIDATION_ERROR`):
            branch on this, never on the wording of `message`'
          examples:
          - EMPTY_FILE
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: Present when the error is tied to a known request_id
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        pipeline_last_stage:
          anyOf:
          - type: string
          - type: 'null'
          title: Pipeline Last Stage
          description: 'The service the error comes from: this one (`orchestrator`, `guardrails`, `extraction`,
            `structuring`, `scoring`), or the pipeline service it called when that one failed'
          examples:
          - orchestrator
      type: object
      required:
      - status_code
      - status_desc
      - message
      - errors
      title: ErrorResponse
      description: Every error response.
    ExtractOcrResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          examples:
          - 200
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          examples:
          - OK
        message:
          type: string
          title: Message
          description: Human-readable; its wording may change, so branch on `errors` instead
          examples:
          - OCR extraction completed successfully
        data:
          anyOf:
          - $ref: '#/components/schemas/KkData'
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Data
          description: The result on 200 (finished); null otherwise. The nine fields when scoring ended
            the request; the result of the last service of `pipeline_name_sequence`, as it is, when the
            sequence ends earlier (the guardrails report, the OCR result, or the structuring result)
        errors:
          anyOf:
          - type: string
          - type: 'null'
          title: Errors
          description: Failure code when the request failed or was refused; null otherwise
          examples:
          - null
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: The request_id this response belongs to
        pipeline_last_stage:
          anyOf:
          - type: string
            enum:
            - orchestrator
            - guardrails
            - extraction
            - structuring
            - scoring
          - type: 'null'
          title: Pipeline Last Stage
          description: 'Null on a success answer (200 finished, 202 still running). On an error, the service
            it comes from, named as in `pipeline_name_sequence`: the one that rejected (`guardrails`,
            `structuring`) or failed; the one that could not be reached or answered an error. `orchestrator`
            when this service refused the request itself before calling any pipeline service (file checks,
            `pipeline_name_sequence`, thresholds, `document_type`, an unknown request_id)'
          examples:
          - structuring
        guardrails:
          anyOf:
          - type: integer
          - type: number
          - type: 'null'
          title: Guardrails
          description: 'With `guardrails_confidence_threshold`: 0 the document passed the guardrails model
            (and the pipeline ran). Without it (left out, `{}`, or only null values) the document is accepted
            whatever the model says, and this is the model''s accepted probability, `1 - probability_bad`,
            a float from 0 to 1 (4 decimals). 1: rejected, by the guardrails model (with a threshold,
            or an image it could not assess) or by the KK validity gate. Null on 202, and when the request
            was refused before the check'
          examples:
          - 0
          - 0.9713
      type: object
      required:
      - status_code
      - status_desc
      - message
      title: ExtractOcrResponse
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          description: Always `healthy` while the process is alive
          examples:
          - healthy
        version:
          type: string
          title: Version
          description: Service version
          examples:
          - 1.0.0
        device:
          type: string
          title: Device
          description: Where this service computes
          examples:
          - cpu
        backends:
          additionalProperties:
            type: string
          type: object
          title: Backends
          description: Active implementation per concern (model backend, storage). Useful to confirm a
            deployment
          examples:
          - extraction: paddle
            storage: postgres
      type: object
      required:
      - status
      - version
      - device
      - backends
      title: HealthResponse
      description: '`GET /health`.'
    KkData:
      properties:
        no_kk:
          $ref: '#/components/schemas/ContractField'
          description: The 16-digit KK number
        nama_kepala_keluarga:
          $ref: '#/components/schemas/ContractField'
          description: Name of the head of the household
        anggota_keluarga:
          items:
            $ref: '#/components/schemas/KkMember'
          type: array
          title: Anggota Keluarga
          description: One entry per member, in the order printed on the card; may be empty
      type: object
      required:
      - no_kk
      - nama_kepala_keluarga
      - anggota_keluarga
      title: KkData
      description: '`data` of a completed request: nine fields, and nothing else.


        Structuring extracts 11 document fields and 15 per member; only these leave. The rest stay in

        `nilam_structuring_results` and are readable through `GET /v1/structuring/jobs/{request_id}`.'
    KkMember:
      properties:
        nama_lengkap:
          $ref: '#/components/schemas/ContractField'
        nik:
          $ref: '#/components/schemas/ContractField'
        pendidikan:
          $ref: '#/components/schemas/ContractField'
        jenis_pekerjaan:
          $ref: '#/components/schemas/ContractField'
        status_hubungan_dalam_rumah_tangga:
          $ref: '#/components/schemas/ContractField'
          description: The card itself prints STATUS HUBUNGAN DALAM KELUARGA; this contract says `...dalam_rumah_tangga`
            because the consumer asked for it. Internally the field keeps the card's name -- one of only
            two keys the projection renames
        ayah:
          $ref: '#/components/schemas/ContractField'
        ibu:
          $ref: '#/components/schemas/ContractField'
      type: object
      required:
      - nama_lengkap
      - nik
      - pendidikan
      - jenis_pekerjaan
      - status_hubungan_dalam_rumah_tangga
      - ayah
      - ibu
      title: KkMember
      description: One row of `anggota_keluarga`. All seven keys are always present.
    ReadyResponse:
      properties:
        status:
          type: string
          enum:
          - ready
          - not_ready
          title: Status
          description: '`ready` (HTTP 200) when every check is `ok`, else `not_ready` (HTTP 503)'
          examples:
          - ready
        checks:
          additionalProperties:
            type: string
            enum:
            - ok
            - failed
          type: object
          title: Checks
          description: One entry per REQUIRED dependency of this service; empty when it has none
          examples:
          - database: ok
      type: object
      required:
      - status
      - checks
      title: ReadyResponse
      description: '`GET /ready`.'
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: API key for this service
      in: header
      name: X-API-Key
tags:
- name: Extract OCR
  description: Start the pipeline for a document, and read where a request is
- name: Health
  description: Liveness and readiness probes; no API key
