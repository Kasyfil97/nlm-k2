openapi: 3.1.0
info:
  title: OCR Kartu Keluarga Structuring API
  description: 'Pipeline step 3 for Indonesian Kartu Keluarga: turns raw OCR text lines into named fields
    (nomor_kk, nama, nama_badan) with per-field confidence. **Async pipeline:** the OCR service POSTs
    /v1/structuring/jobs and gets 202; this service structures in the background, stores the result, POSTs
    a stage callback to the orchestrator, and hands the job to the scoring service. /v1/structuring-direct
    runs the same rules on an OCR result synchronously, for testing this stage alone; /v1/ocr_postprocess
    is the K2Regex-v2 endpoint on raw boxes. All endpoints except /health require an X-API-Key header.


    ## Conventions (the same for every nlm-k2 service)


    **Authentication.** Every endpoint except `/health`, `/ready` and `/metrics` requires the header `X-API-Key`.

    A missing or wrong key answers `401`. The services are reachable only from inside the cluster.


    **Envelope.** Every JSON response, success or error, has the same shape:

    `{status_code, status_desc, message, data, errors, request_id}`. `status_code` always equals the HTTP

    status. On success `errors` is null; on error `data` is null.


    **Errors.** `errors` is a stable, machine-readable code; branch on it, not on the wording of `message`.

    The document checks: `EMPTY_FILE`, `UNSUPPORTED_FILE_TYPE`, `UNREADABLE_FILE`, `TOO_MANY_PAGES`,

    `INVALID_FILE_SOURCE`, `FILE_URL_REJECTED` (400), `FILE_TOO_LARGE` (413). Otherwise the code of the
    status:

    `UNAUTHORIZED` (401), `REQUEST_ID_NOT_FOUND` (404, an unknown request_id), `NOT_FOUND` (404, a path
    that does

    not exist), `METHOD_NOT_ALLOWED` (405), `VALIDATION_ERROR` (422), `TOO_MANY_REQUESTS` (429),

    `INTERNAL_SERVER_ERROR` (500), `DOWNSTREAM_UNAVAILABLE` (503), `DOWNSTREAM_TIMEOUT` (504), unless
    an endpoint

    documents a more precise one. Every error also names the service it comes from in `pipeline_last_stage`.

    `400` = the request or the document is unusable (do not retry unchanged). `503` / `504` are safe to
    retry.


    **request_id.** Minted by the central orchestrator and carried through every stage. Where an endpoint
    has

    no request_id of its own, the `X-Request-ID` request header is used (and echoed in the response header);

    without it the service generates one.


    **Asynchronous stages** (internal: only the orchestrator and the previous stage call them). `POST

    .../jobs` answers `202` immediately and does the work in the background. The outcome is reported by
    a

    callback to the central orchestrator (see *Webhooks*), and can be read at any time with

    `GET .../jobs/{request_id}`, which the orchestrator''s `GET /v1/extract-ocr/{request_id}` combines

    over the three stages. Submitting the same request_id again is idempotent:

    `202` with `duplicate: true`, the work is not repeated, unless the earlier attempt `FAILED` or has
    been

    `PROCESSING` for longer than the job lease (`PIPELINE_JOB_LEASE_SECONDS`, 5 minutes by default: the

    process running it died). A job still running when the service shuts down is reported `FAILED`. Because

    the request was already answered `202`, a problem with the document itself (unreadable file, no text,

    unsupported document type) shows up as a `FAILED` job and callback, not as a `4xx`.

    '
  version: 1.0.0
servers:
- url: /
  description: This host (where this page is served)
- url: http://nlm-k2-structuring.{namespace}.svc.cluster.local:8043
  description: GKE, from inside the release's namespace (the other services of this pipeline)
  variables:
    namespace:
      default: nlm-k2
      description: 'Namespace of the Helm release (deploy/helm/deploy.sh: nlm-k2)'
- url: http://structuring:8043
  description: The Docker Compose network
- url: http://127.0.0.1:8043
  description: Local development
paths:
  /health:
    get:
      tags:
      - Health
      summary: Liveness probe
      description: Says the process is alive and which implementations are active. Never touches a dependency.
        Does not require an API key.
      operationId: getHealth
      responses:
        '200':
          description: The process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: Healthy
                  value:
                    status: healthy
                    version: 1.0.0
                    device: cpu
                    backends:
                      structuring: mock
                      storage: postgres
  /ready:
    get:
      tags:
      - Health
      summary: Readiness probe
      description: 'Liveness vs readiness: /health only says the process is alive and never touches a
        dependency (a database blip must not make Kubernetes restart every pod). /ready says whether this
        pod can do its job right now: 200 when every REQUIRED dependency of this service answers, 503
        otherwise, so the pod is taken out of the Service until it recovers. Downstream stages and model
        services are deliberately not checked: their outage is reported per job, not by refusing traffic.
        Does not require an API key.'
      operationId: getReadiness
      responses:
        '200':
          description: Every required dependency answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              examples:
                ready:
                  summary: Ready
                  value:
                    status: ready
                    checks:
                      database: ok
        '503':
          description: A required dependency is unavailable; the pod is taken out of the Service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                status: not_ready
                checks:
                  database: failed
  /metrics:
    get:
      tags:
      - Health
      summary: Prometheus metrics
      description: 'Prometheus text exposition of this process: `http_requests_total` and `http_request_duration_seconds`
        per route template, and for the pipeline stages `pipeline_jobs_total` (by outcome), `pipeline_job_duration_seconds`,
        `pipeline_stale_jobs_reclaimed_total`, `pipeline_outbox_deliveries_total` and the outbox backlog
        gauges (`pipeline_outbox_pending`, `_retrying`, `_dead_letters`, `_oldest_pending_seconds`). Scraped
        inside the cluster; does not require an API key.'
      operationId: getMetrics
      responses:
        '200':
          description: Metrics in the Prometheus text format
          content:
            text/plain:
              schema:
                type: string
  /v1/structuring/jobs:
    post:
      tags:
      - Pipeline
      summary: Hand OCR output to the structuring stage
      description: '**Step 3 of the pipeline, asynchronous. Called by the OCR service, not by the orchestrator.**


        Records the job (`structuring_jobs`, idempotent per request_id), answers **202 immediately**,
        then in the background: turns the OCR lines into named fields, stores the result (`structuring_results`),
        POSTs the `STRUCTURING` callback, and hands the job (guardrails + OCR + structuring results) to
        the scoring service.


        A document that is not a lone KK card fails the job with a reason: an upload that also contains
        a KTP / KK / marriage certificate, a CAPTCHA page, a screenshot of the DJP KK lookup, more than
        2 pages, or no text at all.'
      operationId: submitStructuringJob
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StructuringJobRequest'
        required: true
      responses:
        '202':
          description: The job was accepted (or already existed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
              examples:
                accepted:
                  summary: New job
                  value:
                    status_code: 202
                    status_desc: Accepted
                    message: Accepted
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: STRUCTURING
                      status: PROCESSING
                      duplicate: false
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                duplicate:
                  summary: 'Same request_id sent again: nothing is re-run'
                  value:
                    status_code: 202
                    status_desc: Accepted
                    message: Accepted
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: STRUCTURING
                      status: DONE
                      duplicate: true
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: UNAUTHORIZED
                pipeline_last_stage: structuring
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'body.request_id: Field required'
                errors: VALIDATION_ERROR
                pipeline_last_stage: structuring
      security:
      - APIKeyHeader: []
  /v1/structuring/jobs/{request_id}:
    get:
      tags:
      - Pipeline
      summary: Status and result of the structuring stage
      description: 'Status of this stage only, and its structured fields once `DONE`. Internal: the orchestrator
        KK reads it (while it waits, and for its `GET /v1/extract-ocr/{request_id}`), and it helps to
        debug.'
      operationId: getStructuringJob
      security:
      - APIKeyHeader: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      responses:
        '200':
          description: The job exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuringJobStatusResponse'
