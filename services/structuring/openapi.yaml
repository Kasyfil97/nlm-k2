          title: Dead Letters
          description: Messages given up on (a 4xx from the receiver, or 5xx for longer than `PIPELINE_OUTBOX_MAX_AGE_SECONDS`).
            They stay in `pipeline_outbox` with `failed_at` and `last_error` for inspection and are never
            retried; anything above 0 needs a human
          examples:
          - 0
      type: object
      required:
      - enabled
      - stage
      - pending
      - retrying
      - dead_letters
      title: OutboxStatus
      description: The `data` of `GET /v1/<stage>/outbox`.
    OutboxStatusResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          default: 200
          examples:
          - 200
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          default: OK
          examples:
          - OK
        message:
          type: string
          title: Message
          description: Human-readable outcome
          default: Success
          examples:
          - Success
        errors:
          type: 'null'
          title: Errors
          description: Always null on success
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: 'The request_id this response belongs to: the one sent in the form / body / path,
            otherwise the `X-Request-ID` header, otherwise one generated by the service'
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        data:
          $ref: '#/components/schemas/OutboxStatus'
      type: object
      required:
      - data
      title: OutboxStatusResponse
      description: Envelope of `GET /v1/<stage>/outbox`.
    ReadyResponse:
      properties:
        status:
          type: string
          enum:
          - ready
          - not_ready
          title: Status
          description: '`ready` (HTTP 200) when every check is `ok`, else `not_ready` (HTTP 503)'
          examples:
          - ready
        checks:
          additionalProperties:
            type: string
            enum:
            - ok
            - failed
          type: object
          title: Checks
          description: One entry per REQUIRED dependency of this service; empty when it has none
          examples:
          - database: ok
      type: object
      required:
      - status
      - checks
      title: ReadyResponse
      description: '`GET /ready`.'
    StageCallback:
      properties:
        request_id:
          type: string
          title: Request Id
          description: The request_id you submitted with `POST /v1/extraction/jobs`
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        stage:
          type: string
          enum:
          - OCR
          - STRUCTURING
          - SCORING
          title: Stage
          description: 'Stage the status is about. Usually the sender''s own stage; when the hand-off
            to the NEXT stage fails after retries, the sender reports `status: FAILED` with the next stage''s
            name, because that stage never received the job and cannot report for itself'
          examples:
          - OCR
        status:
          type: string
          enum:
          - DONE
          - FAILED
          title: Status
          description: Outcome of the stage. `FAILED` of any stage ends the request
          examples:
          - DONE
        result:
          type: 'null'
          title: Result
          description: Always null for OCR and STRUCTURING; read the stage result from GET .../jobs/{request_id}
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
          description: Why it failed; null when `status` is `DONE`
          examples:
          - null
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
          description: 'Only on a rejection: `DOWNSTREAM_VALIDATION_ERROR` when the KK validity gate rejected
            the document (`error_message` is the Indonesian reason). Absent when a stage broke'
          examples:
          - null
      type: object
      required:
      - request_id
      - stage
      - status
      title: StageCallback
      description: Body of the callback a stage POSTs to the orchestrator when it finishes.
    StructureRequest:
      properties:
        texts:
          items:
            $ref: '#/components/schemas/BoundedOcrBoxPayload'
          type: array
          maxItems: 5000
          minItems: 1
          title: Texts
          description: OCR text boxes in reading order (top to bottom)
      type: object
      required:
      - texts
      title: StructureRequest
      description: 'Body of the legacy synchronous `POST /v1/ocr_postprocess`.


        `texts` keeps `min_length=1` here **on purpose**, and only here: §11 lists this endpoint as kept

        as it is, and the ML team calls it directly with text it already has. The asynchronous job

        endpoint must not inherit the constraint -- see `StructuringJobRequest`.'
    StructureResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          default: 200
          examples:
          - 200
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          default: OK
          examples:
          - OK
        message:
          type: string
          title: Message
          description: Human-readable outcome
          default: Success
          examples:
          - Success
        errors:
          type: 'null'
          title: Errors
          description: Always null on success
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: 'The request_id this response belongs to: the one sent in the form / body / path,
            otherwise the `X-Request-ID` header, otherwise one generated by the service'
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        data:
          $ref: '#/components/schemas/StructuringPayload'
      type: object
      required:
      - data
      title: StructureResponse
    StructuredFieldPayload:
      properties:
        value:
          type: string
          title: Value
          description: The value; `""` when not found -- never null
          default: ''
          examples:
          - '3273012345678901'
        ocr_conf:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Ocr Conf
          description: Lowest recognition score among the OCR boxes that formed this value; null when
            not found
          examples:
          - 0.9991
        crf_conf:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Crf Conf
          description: Forward-backward marginal of the column placement. ALWAYS null for document fields,
            which are found by regex or position and never pass through Viterbi, and null for member cells
            Viterbi did not place
          examples:
          - null
        features:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Features
          description: 'The trust model''s input vector for this field, present only for the NINE scored
            contract fields and null everywhere else. It exists because the two scores above do not separate
            a correct value from a wrong one: over 1686 hand-labelled cells `crf_conf` scores AUC 0.502,
            no better than a coin, while the parser internals that do carry the signal are computed and
            then discarded. Names are pinned by `kk.MEMBER_CELL_FEATURES` (member cells) and `kk.DOC_CELL_FEATURES`
            (document fields); scoring assembles them and never recomputes one, because the same feature
            computed in two places is how a model ends up good in training and bad in production'
          examples:
          - emis_assigned_min: 0.0
            lebar_rel: 0.87
            marg_min: 0.9967
            margin_min: 0.9934
      additionalProperties: true
      type: object
      title: StructuredFieldPayload
      description: One named field read by structuring, carrying two scores that are deliberately not
        fused.
    StructuredMemberPayload:
      properties:
        nama_lengkap:
          $ref: '#/components/schemas/StructuredFieldPayload'
        nik:
          $ref: '#/components/schemas/StructuredFieldPayload'
        jenis_kelamin:
          $ref: '#/components/schemas/StructuredFieldPayload'
        tempat_lahir:
          $ref: '#/components/schemas/StructuredFieldPayload'
        tanggal_lahir:
          $ref: '#/components/schemas/StructuredFieldPayload'
        agama:
          $ref: '#/components/schemas/StructuredFieldPayload'
        pendidikan:
          $ref: '#/components/schemas/StructuredFieldPayload'
        jenis_pekerjaan:
          $ref: '#/components/schemas/StructuredFieldPayload'
        golongan_darah:
          $ref: '#/components/schemas/StructuredFieldPayload'
        status_perkawinan:
          $ref: '#/components/schemas/StructuredFieldPayload'
        tanggal_perkawinan:
          $ref: '#/components/schemas/StructuredFieldPayload'
        status_hubungan_dalam_keluarga:
          $ref: '#/components/schemas/StructuredFieldPayload'
        kewarganegaraan:
          $ref: '#/components/schemas/StructuredFieldPayload'
        ayah:
          $ref: '#/components/schemas/StructuredFieldPayload'
        ibu:
          $ref: '#/components/schemas/StructuredFieldPayload'
      additionalProperties: true
      type: object
      required:
      - nama_lengkap
      - nik
      - jenis_kelamin
      - tempat_lahir
      - tanggal_lahir
      - agama
      - pendidikan
      - jenis_pekerjaan
      - golongan_darah
      - status_perkawinan
      - tanggal_perkawinan
      - status_hubungan_dalam_keluarga
      - kewarganegaraan
      - ayah
      - ibu
      title: StructuredMemberPayload
      description: One row of `anggota_keluarga`. All fifteen keys are always present, even when empty.
    StructuringDirectRequest:
      properties:
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: Echoed in the response; optional, nothing is recorded under it
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        document_type:
          type: string
          title: Document Type
          description: Only `kk` is supported; anything else is 400
          default: kk
          examples:
          - kk
        ocr:
          $ref: '#/components/schemas/OcrPayload'
          description: 'The extraction service''s output: `data` of its `POST /v1/extraction/extract`,
            or the `result` of `GET /v1/extraction/jobs/{request_id}`. Only `texts` is read, and it may
            be empty'
      type: object
      required:
      - ocr
      title: StructuringDirectRequest
      description: '`POST /v1/structuring-direct`: the previous stage''s output, nothing of the pipeline
        run.'
    StructuringDirectResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          default: 200
          examples:
          - 200
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          default: OK
          examples:
          - OK
        message:
          type: string
          title: Message
          description: Human-readable outcome
          default: Success
          examples:
          - Success
        errors:
          type: 'null'
          title: Errors
          description: Always null on success
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: 'The request_id this response belongs to: the one sent in the form / body / path,
            otherwise the `X-Request-ID` header, otherwise one generated by the service'
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        data:
          $ref: '#/components/schemas/StructuringPayload'
      type: object
      required:
      - data
      title: StructuringDirectResponse
    StructuringJobRequest:
      properties:
        request_id:
          type: string
          minLength: 1
          title: Request Id
          description: request_id of the pipeline run
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        document_type:
          type: string
          title: Document Type
          description: Only `kk` is supported
          default: kk
          examples:
          - kk
        guardrails:
          anyOf:
          - $ref: '#/components/schemas/GuardrailsResult'
          - type: 'null'
          description: Guardrails result submitted with the OCR job; only forwarded to the next stage
        ocr:
          anyOf:
          - $ref: '#/components/schemas/OcrPayload'
          - type: 'null'
          description: 'Result of the OCR stage. Left out when the OCR service hands off by reference
            (`PIPELINE_HANDOFF_BY_REFERENCE`, recommended for KK): this service then reads `ocr_results`
            of the shared database. Its `texts` MAY be empty -- an image with no readable text has to
            reach the validity gate to be rejected there, so this endpoint does not require at least one'
        pipeline_name_sequence:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Pipeline Name Sequence
          description: 'The services this request runs, in order, from the central orchestrator (forwarded
            by the orchestrator and each stage): `guardrails`, `extraction`, `structuring`, `scoring`,
            guardrails optional at the front and the end cut off, never one skipped in the middle. The
            last one ends the request: its result is the answer, as it is, and nothing is handed on. Omitted:
            the full pipeline'
          examples:
          - - guardrails
            - extraction
            - structuring
            - scoring
        column_confidence_threshold:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Column Confidence Threshold
          description: 'Per field, from the central orchestrator: the trust model''s probability that
            the field''s value is correct must reach it for the field''s `confidence` to be `1` (else
            `0`). Keys are the contract names: `no_kk`, `nama_kepala_keluarga`, and the seven member fields
            (`nama_lengkap`, `nik`, `pendidikan`, `jenis_pekerjaan`, `status_hubungan_dalam_rumah_tangga`,
            `ayah`, `ibu`), a member field''s threshold applying to every member. `all_field` sets one
            threshold for every field; a key for a single field overrides it. A field left out (or the
            whole map omitted) uses the trust model''s own threshold for that field; a field the model
            has none for (`no_kk`) is then `0`'
          examples:
          - nik: 0.8
            no_kk: 0.9
      type: object
      required:
      - request_id
      title: StructuringJobRequest
      description: Body of `POST /v1/structuring/jobs` (§7.1).
    StructuringJobStatus:
      properties:
        request_id:
          type: string
          title: Request Id
          description: request_id of the pipeline run
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        stage:
          type: string
          const: STRUCTURING
          title: Stage
          description: Always `STRUCTURING` on this service
          default: STRUCTURING
          examples:
          - STRUCTURING
        status:
          type: string
          enum:
          - PROCESSING
          - DONE
          - FAILED
          title: Status
          description: '`PROCESSING` -> `DONE` | `FAILED`. A `FAILED` job may go back to `PROCESSING`
            when resubmitted'
          examples:
          - DONE
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
          description: Why the stage failed; null unless `status` is `FAILED`. Same text as the FAILED
            callback
          examples:
          - null
        created_at:
          type: string
          title: Created At
          description: When the job was first accepted (ISO 8601, UTC)
          examples:
          - '2026-09-18T04:00:00+00:00'
        updated_at:
          type: string
          title: Updated At
          description: Last status change (ISO 8601, UTC)
          examples:
          - '2026-09-18T04:00:01+00:00'
        pipeline_name_sequence:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Pipeline Name Sequence
          description: 'The services this request runs, as the job was submitted with them; the last one
            ends the request. Null for a job submitted without it: the full pipeline'
          examples:
          - - guardrails
            - extraction
            - structuring
            - scoring
        column_confidence_threshold:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Column Confidence Threshold
          description: 'The central orchestrator''s per-field thresholds, as the job was submitted with
            them; null: the trust model''s own thresholds for every field'
          examples:
          - nik: 0.8
            no_kk: 0.9
        result:
          anyOf:
          - $ref: '#/components/schemas/StructuringPayload'
          - type: 'null'
          description: The structured document once `status` is `DONE`; null otherwise. A **rejected**
            document is also `DONE` and also has a result -- what it carries is `reject_reason`. The orchestrator
            reads that key here and turns it into the client's 400
      type: object
      required:
      - request_id
      - status
      - created_at
      - updated_at
      title: StructuringJobStatus
    StructuringJobStatusResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          default: 200
          examples:
          - 200
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          default: OK
          examples:
          - OK
        message:
          type: string
          title: Message
          description: Human-readable outcome
          default: Success
          examples:
          - Success
        errors:
          type: 'null'
          title: Errors
          description: Always null on success
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: 'The request_id this response belongs to: the one sent in the form / body / path,
            otherwise the `X-Request-ID` header, otherwise one generated by the service'
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        data:
          $ref: '#/components/schemas/StructuringJobStatus'
      type: object
      required:
      - data
      title: StructuringJobStatusResponse
    StructuringPayload:
      properties:
        nomor_kk:
          $ref: '#/components/schemas/StructuredFieldPayload'
          description: 'The KK number. Note `nomor_kk`, not `no_kk`: the rename happens in the orchestrator'
        nama_kepala_keluarga:
          $ref: '#/components/schemas/StructuredFieldPayload'
        alamat:
          $ref: '#/components/schemas/StructuredFieldPayload'
        desa_kelurahan:
          $ref: '#/components/schemas/StructuredFieldPayload'
        rt:
          $ref: '#/components/schemas/StructuredFieldPayload'
          description: 'Shares one `ocr_conf` with `rw`: both are cut from the same OCR box'
        rw:
          $ref: '#/components/schemas/StructuredFieldPayload'
        kecamatan:
          $ref: '#/components/schemas/StructuredFieldPayload'
        kabupaten_kota:
          $ref: '#/components/schemas/StructuredFieldPayload'
        provinsi:
          $ref: '#/components/schemas/StructuredFieldPayload'
        kode_pos:
          $ref: '#/components/schemas/StructuredFieldPayload'
        tanggal_dikeluarkan:
          $ref: '#/components/schemas/StructuredFieldPayload'
        anggota_keluarga:
          items:
            $ref: '#/components/schemas/StructuredMemberPayload'
          type: array
          title: Anggota Keluarga
          description: One entry per row on the card, in card order. May be empty, which the validity
            gate rejects
        reject_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reject Reason
          description: The first rejecting rule of the KK validity gate, in Indonesian; null when accepted.
            It lives in this payload rather than only in the outcome row because the orchestrator is stateless
            and reads stages through their API -- a reason kept elsewhere could never become the client's
            400
          examples:
          - null
      additionalProperties: true
      type: object
      required:
      - nomor_kk
      - nama_kepala_keluarga
      - alamat
      - desa_kelurahan
      - rt
      - rw
      - kecamatan
      - kabupaten_kota
      - provinsi
      - kode_pos
      - tanggal_dikeluarkan
      title: StructuringPayload
      description: Result of the structuring stage (`structuring_results`), forwarded to scoring.
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: API key for this service
      in: header
      name: X-API-Key
tags:
- name: Pipeline
  description: 'Asynchronous pipeline stage: 202, background work, callback, hand-off'
- name: Callbacks
  description: Requests this service SENDS to the orchestrator (see Webhooks)
- name: Direct
  description: 'This stage alone on the previous stage''s output, synchronous: nothing recorded (QC)'
- name: Structuring
  description: Raw text -> named fields, synchronous
- name: Health
  description: Liveness and readiness probes; no API key
