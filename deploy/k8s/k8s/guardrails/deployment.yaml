apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-bribrain-nilam-ocr-kk-guardrails
  namespace: bribrain-ocr-nilam
  labels:
    app: ms-bribrain-nilam-ocr-kk-guardrails
    app.kubernetes.io/name: ms-bribrain-nilam-ocr-kk-guardrails
    app.kubernetes.io/part-of: ms-bribrain-nilam-ocr-kk
    app.kubernetes.io/component: guardrails
    version: "<IMAGE_VERSION>"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: ms-bribrain-nilam-ocr-kk-guardrails
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: ms-bribrain-nilam-ocr-kk-guardrails
        app.kubernetes.io/name: ms-bribrain-nilam-ocr-kk-guardrails
        app.kubernetes.io/part-of: ms-bribrain-nilam-ocr-kk
        app.kubernetes.io/component: guardrails
        version: "<IMAGE_VERSION>"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8061"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: nexus-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: guardrails
        # <NEXUS_REGISTRY_URL> dan <IMAGE_VERSION> diisi oleh deploy.sh
        image: <NEXUS_REGISTRY_URL>/bribrain/dev/nilam/nilam-ocr-kk/ms-bribrain-nilam-ocr-kk-guardrails:<IMAGE_VERSION>
        imagePullPolicy: Always
        ports:
        - containerPort: 8061
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: ms-bribrain-nilam-ocr-kk-guardrails-config
        env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: ms-bribrain-nilam-ocr-kk-secrets
              key: API_KEY
        - name: API_KEYS
          valueFrom:
            secretKeyRef:
              name: ms-bribrain-nilam-ocr-kk-secrets
              key: API_KEYS
              optional: true
        - name: ELASTIC_APM_SECRET_TOKEN
          valueFrom:
            secretKeyRef:
              name: ms-bribrain-nilam-ocr-kk-secrets
              key: ELASTIC_APM_SECRET_TOKEN
              optional: true
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: HOME
          value: /tmp
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 2
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "5"]
        # Pasangan configmap: GUARDRAILS_MAX_CONCURRENCY = limits.cpu (2 core) x 1 thread torch. CPU request = limit
        # supaya 2 core itu dijamin, bukan hanya sisa CPU node. Memory ~400Mi model + ~400Mi per slot (2) = ~1,2Gi.
        resources:
          requests:
            cpu: "2000m"
            memory: "1.5Gi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        # Bobot model sudah ada di image (/app/weights); jangan mount volume di path itu.
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
