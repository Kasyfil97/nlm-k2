apiVersion: v1
kind: ConfigMap
metadata:
  name: ms-bribrain-nilam-ocr-kk-orchestrator-config
  namespace: bribrain-ocr-nilam
  labels:
    app: ms-bribrain-nilam-ocr-kk-orchestrator
    app.kubernetes.io/name: ms-bribrain-nilam-ocr-kk-orchestrator
    app.kubernetes.io/part-of: ms-bribrain-nilam-ocr-kk
    app.kubernetes.io/component: orchestrator
data:
  ENVIRONMENT: "production"
  PORT: "8060"
  GUARDRAILS_SERVICE_URL: "http://ms-bribrain-nilam-ocr-kk-guardrails:8061"
  EXTRACTION_SERVICE_URL: "http://ms-bribrain-nilam-ocr-kk-extraction:8062"
  STRUCTURING_SERVICE_URL: "http://ms-bribrain-nilam-ocr-kk-structuring:8063"
  SCORING_SERVICE_URL: "http://ms-bribrain-nilam-ocr-kk-scoring:8064"
  FILE_URL_ALLOWED_HOSTS: "<FILE_URL_ALLOWED_HOSTS>"
  FILE_URL_ALLOW_HTTP: "true"
  TESTING_ENDPOINTS: "false"
  PIPELINE_WAIT_SECONDS: "15"
  GUARDRAILS_TIMEOUT_SECONDS: "20"
  # Tanpa rate limit, seperti NPWP: semua request Nilam datang dari Orkestrasi pusat dengan satu API key, jadi
  # batas per API key (default 60/menit) membatasi seluruh Nilam. Beban dibatasi bulkhead guardrails (503
  # SERVICE_BUSY + Retry-After).
  RATE_LIMIT_ENABLED: "false"
  # Elastic APM (ocr_common/web/apm.py); tokennya dari Secret, bukan di sini
  ELASTIC_APM_SERVER_URL: "http://ms-bribrain-nilam-elastic-apm-server.bribrain-ocr-nilam.svc.cluster.local:8200"
  ELASTIC_APM_ENVIRONMENT: "dev"
  # Log aplikasi ikut ke Elasticsearch lewat server APM yang sama (OTLP, ocr_common/web/log_shipping.py):
  # Kibana, halaman service APM tab Logs. Isi upload dan field hasil ekstraksi tidak pernah ikut.
  ELASTIC_APM_LOG_SENDING: "true"
  ELASTIC_APM_LOG_LEVEL: "INFO"
