{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled (dig "dotenv" "enabled" false $svc) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nlm-k2.componentName" (dict "root" $ "name" $name "svc" $svc) }}-env
  labels:
    {{- include "nlm-k2.componentLabels" (dict "root" $ "name" $name "svc" $svc) | nindent 4 }}
type: Opaque
data:
  {{- toYaml $svc.dotenv.data | nindent 2 }}
{{- end }}
{{- end }}
