{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nlm-k2.componentName" (dict "root" $ "name" $name) }}
  labels:
    {{- include "nlm-k2.componentLabels" (dict "root" $ "name" $name "svc" $svc) | nindent 4 }}
data:
  {{- include "nlm-k2.serviceEnv" (dict "root" $ "svc" $svc) | indent 2 }}
{{- end }}
{{- end }}
