nameOverride: ""
fullnameOverride: ""

revisionHistoryLimit: 5
# Default untuk semua service; services.<nama>.terminationGracePeriodSeconds menimpanya.
# 45 = drain job 30 dtk (PIPELINE_DRAIN_TIMEOUT_SECONDS) + preStop 5 dtk + cadangan.
terminationGracePeriodSeconds: 45

environment: production

image:
  registry: asia-southeast2-docker.pkg.dev/common-cicd-dev-01/gc-bribrain-dev-gar-temp-01
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

existingSecret: nlm-k2-secrets
secretKeys:
  apiKey: API_KEY
  # Opsional: key lain yang juga diterima (dipisah koma) selama rotasi; lihat README "API key".
  apiKeys: API_KEYS
  databaseUrl: DATABASE_URL
  orchestrationApiKey: ORCHESTRATION_API_KEY
  # Nilai X-Callback-Key untuk callback hasil Orkestrasi (orchestration.callbackFormat: result).
  callbackKey: ORCHESTRATION_CALLBACK_KEY
  # Opsional: kredensial server Elastic APM, salah satu sesuai server APM-nya (lihat apm di bawah).
  apmSecretToken: ELASTIC_APM_SECRET_TOKEN
  apmApiKey: ELASTIC_APM_API_KEY

# Buat Secret di atas dari GCP Secret Manager lewat External Secrets Operator.
# Mati = Secret dibuat manual (lihat README). Butuh CRD ESO dan ClusterSecretStore di cluster.
externalSecret:
  enabled: false
  apiVersion: external-secrets.io/v1
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  remoteKeys:
    apiKey: nlm-k2-api-key
    databaseUrl: nlm-k2-database-url
    orchestrationApiKey: nlm-k2-orchestration-api-key
    # Kosong = tidak diambil dari Secret Manager.
    callbackKey: ""

# Callback tahap ke Orkestrasi pusat, dikirim oleh ketiga tahap pipeline (bukan oleh orchestrator).
# Kosong = tidak ada callback yang dikirim maupun diantrekan; hasil sampai ke Orkestrasi lewat tabelnya
# sendiri (ORCHESTRATION_OUTCOME_TABLE dan/atau ORCHESTRATION_API_EVENTS_TABLE di commonEnv) dan
# GET /v1/extract-ocr/{request_id} di orchestrator. Tahap pipeline menolak start kalau semuanya kosong.
orchestration:
  url: ""
  callbackPath: /v1/callbacks/stage
  timeoutSeconds: "10"
  # stage  = satu callback per tahap (OCR, STRUCTURING, SCORING) dengan X-API-Key.
  # result = satu callback hasil per request saat selesai (completed dari scoring, failed dari tahap
  #          mana pun) dengan X-Callback-Key dari secretKeys.callbackKey; tanpa key, service menolak start.
  callbackFormat: stage
  # Saklar callback: false = tidak ada callback yang dikirim maupun diantrekan walau url terisi, mis. selama
  # Orkestrasi pusat memasang KK di mode poll (setiap callback dijawab 409 CALLBACK_NOT_EXPECTED; mereka
  # membaca GET /v1/extract-ocr/{request_id}). Harus mengikuti mode di sisi mereka.
  callbackEnabled: true
  # Berapa lama outbox mencoba ulang callback yang gagal (5xx / tidak terjangkau). Orkestrasi pusat berhenti
  # menunggu sejumlah detik setelah menjawab 202 (OCR_CALLBACK_DEADLINE_SECONDS di sisi mereka) dan menolak
  # callback sesudahnya dengan 409 RESULT_CONFLICT; samakan dengan nilai itu.
  callbackMaxAgeSeconds: "600"

# Elastic APM di kelima service (libs/ocr_common/ocr_common/web/apm.py). serverUrl kosong = mati: agen tidak dimuat
# dan tidak ada yang dikirim. Token/API key dibaca dari Secret (secretKeys.apmSecretToken / apmApiKey), opsional.
# Body, header, dan variabel lokal request tidak pernah dikirim (upload KK, 26 field hasil ekstraksi), dan service
# menolak start kalau variabel ELASTIC_APM_* menyalakannya lagi (docs/decisions/2026-09-26-keputusan-fase-0.md §4).
# Nama service APM bawaan kode: nilam-ocr-kk-<service>; satu service bisa menimpanya lewat
# services.<nama>.env.ELASTIC_APM_SERVICE_NAME.
apm:
  serverUrl: ""
  # Kosong = nilai `environment` di atas.
  environment: ""
  # 1.0 = setiap request dan job dilacak; turunkan kalau volumenya besar.
  transactionSampleRate: "1.0"
  verifyServerCert: true
  # Nama field yang disamarkan, dipisah koma, boleh wildcard (`*token`). Kosong = daftar bawaan agen.
  sanitizeFieldNames: ""
  # Log aplikasi juga dikirim ke server APM ini (OpenTelemetry, OTLP/HTTP /v1/logs; web/log_shipping.py) dan masuk
  # Elasticsearch (logs-apm.app.<service>-default), di bawah service name APM yang sama. Log stderr tetap ada.
  # Hanya berlaku dengan serverUrl.
  logSending: false
  # Level minimum yang dikirim, tidak bisa di bawah LOG_LEVEL. Kosong = INFO.
  logLevel: ""

# Anotasi prometheus.io/scrape|port|path di pod, untuk Prometheus yang menemukan target lewat anotasi. Tiap service
# membuka GET /metrics di port-nya (http_requests_total, pipeline_*). false = tanpa anotasi (mis. ServiceMonitor).
prometheusAnnotations: true

commonEnv:
  # Host yang boleh dipakai file_url (presigned MinIO), dipisah koma; ".example.internal" = semua subdomain.
  # Kosong = hanya host yang resolve ke alamat publik, jadi MinIO di jaringan internal ditolak: isi sebelum deploy.
  FILE_URL_ALLOWED_HOSTS: ""
  # Endpoint -test untuk load test tim ML (orchestrator /v1/extract-ocr-test, /v1/<tahap>/jobs-test): pipeline
  # yang sama di tabel testing_*, tanpa callback dan tanpa menulis ke tabel Orkestrasi. Hanya untuk dev.
  TESTING_ENDPOINTS: "false"

# Tiap service = satu Deployment + satu Service `<release>-<nama>` + satu ConfigMap.
#   entrypoint : dipanggil dari luar release (Orkestrasi pusat). Ikut di Service gabungan `<release>`
#                dan NetworkPolicy-nya menerima namespace di networkPolicy.clientNamespaces. Hanya
#                orchestrator; yang lain internal.
#   pipeline   : tahap async yang butuh DATABASE_URL dan konfigurasi Orkestrasi.
#   database   : butuh DATABASE_URL tanpa konfigurasi Orkestrasi (orchestrator: tabel guardrails_results).
#   upstreams  : service lain yang dipanggil; chart mengisi <NAMA>_SERVICE_URL dan NetworkPolicy dari sini.
# Nama service dipakai sebagai nama port Kubernetes: maksimal 15 karakter, huruf kecil/angka, tanpa `-`.
services:
  # Pintu masuk tunggal: POST /v1/extract-ocr (cek guardrails, hand-off ke extraction, tunggu pipeline)
  # dan GET /v1/extract-ocr/{request_id}. Tanpa callback; DB hanya untuk mencatat setiap putusan guardrails
  # (guardrails_results, migrasi 0002), best-effort: DB yang mati tidak menggagalkan request.
  orchestrator:
    enabled: true
    image:
      repository: ms-bribrain-nilam-ocr-kk-orchestrator
      tag: ""
    port: 8060
    entrypoint: true
    pipeline: false
    database: true
    upstreams: [guardrails, extraction, structuring, scoring]
    replicaCount: 2
    startupFailureThreshold: 15
    # Satu POST bisa memakan cek guardrails (GUARDRAILS_TIMEOUT_SECONDS) + tunggu pipeline + hand-off;
    # shutdown menunggu request yang sedang ditahan selesai.
    terminationGracePeriodSeconds: 60
    env:
      # Tunggu pipeline sampai selesai (200 + hasil) sebelum menjawab 202; 0 = tidak menunggu.
      PIPELINE_WAIT_SECONDS: "15"
      GUARDRAILS_TIMEOUT_SECONDS: "20"
      # Tanpa rate limit, seperti NPWP: Orkestrasi pusat memakai satu API key untuk semua Nilam. Beban dibatasi
      # bulkhead guardrails (503 SERVICE_BUSY + Retry-After).
      RATE_LIMIT_ENABLED: "false"
    # Tiap request menahan dokumennya (maks. MAX_UPLOAD_BYTES, 10 MB) selama menunggu pipeline.
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

  # Model guardrails, internal: hanya orchestrator yang memanggil POST /v1/guardrails/check.
  guardrails:
    enabled: true
    image:
      repository: ms-bribrain-nilam-ocr-kk-guardrails
      tag: ""
    port: 8061
    entrypoint: false
    pipeline: false
    upstreams: []
    replicaCount: 1
    # Satu-satunya service CPU-bound (torch). Nyalakan di produksi; replicaCount diabaikan saat aktif.
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    startupFailureThreshold: 30
    terminationGracePeriodSeconds: 30
    env:
      # kk_quality = inti K2Quality; menolak start tanpa keenam artefak di GUARDRAILS_WEIGHTS_DIR. Artefaknya
      # diunduh setiap pod start dari GUARDRAILS_MODEL_URI (awalan, scripts/fetch_weights.py --force).
      GUARDRAILS_BACKEND: kk_quality
      GUARDRAILS_WEIGHTS_DIR: weights
      GUARDRAILS_MODEL_URI: gs://gc-bribrain-dev-gcs-ocr-nilam-01/nilam-ocr-kk/guardrails/
      GUARDRAILS_DEVICE: cpu
      # Tanpa ini torch membuat thread sebanyak core node. 1 thread per dokumen, beberapa dokumen paralel.
      GUARDRAILS_TORCH_THREADS: "1"
      # Bulkhead inference per pod: MAX_CONCURRENCY x TORCH_THREADS = limits.cpu; lebih dari itu (dan antrean
      # penuh) 503 SERVICE_BUSY + Retry-After, diteruskan orchestrator apa adanya.
      GUARDRAILS_MAX_CONCURRENCY: "2"
      GUARDRAILS_MAX_QUEUE: "5"
      GUARDRAILS_BUSY_RETRY_AFTER_SECONDS: "5"
      # Tidak ada ambang di sini: hanya `threshold` per request yang menolak; tanpa itu dokumen lolos.
    resources:
      requests:
        cpu: "1"
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi

  extraction:
    enabled: true
    image:
      repository: ms-bribrain-nilam-ocr-kk-extraction
      tag: ""
    port: 8062
    entrypoint: false
    pipeline: true
    upstreams: [structuring]
    replicaCount: 1
    startupFailureThreshold: 15
    env:
      EXTRACTION_BACKEND: paddle
      EXTRACTION_OCR_URL: ""
      EXTRACTION_OCR_TIMEOUT_SECONDS: "60"
      EXTRACTION_OCR_QUERY: '{"doc_orientation": true, "doc_unwarping": true, "textline_orientation": false}'
      PIPELINE_DRAIN_TIMEOUT_SECONDS: "30"
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi

  structuring:
    enabled: true
    image:
      repository: ms-bribrain-nilam-ocr-kk-structuring
      tag: ""
    port: 8063
    entrypoint: false
    pipeline: true
    upstreams: [scoring]
    replicaCount: 1
    startupFailureThreshold: 15
    env:
      # kk_model = m04 (pasangan SCORING_BACKEND=kk_field); bobotnya dari STRUCTURING_MODEL_URI.
      STRUCTURING_BACKEND: kk_model
      STRUCTURING_MODEL_PATH: weights/kk_structuring_model.joblib
      # Diunduh setiap pod start (scripts/fetch_weights.py --force), tidak ikut image.
      STRUCTURING_MODEL_URI: gs://gc-bribrain-dev-gcs-ocr-nilam-01/nilam-ocr-kk/structuring/kk_structuring_model.joblib
      PIPELINE_DRAIN_TIMEOUT_SECONDS: "30"
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi

  scoring:
    enabled: true
    image:
      repository: ms-bribrain-nilam-ocr-kk-scoring
      tag: ""
    port: 8064
    entrypoint: false
    pipeline: true
    upstreams: []
    replicaCount: 1
    startupFailureThreshold: 15
    env:
      # kk_field = trust model s11, hanya sah di atas STRUCTURING_BACKEND=kk_model.
      SCORING_BACKEND: kk_field
      SCORING_MODEL_PATH: weights/kk_trust_model.joblib
      # Diunduh setiap pod start (scripts/fetch_weights.py --force), tidak ikut image.
      SCORING_MODEL_URI: gs://gc-bribrain-dev-gcs-ocr-nilam-01/nilam-ocr-kk/scoring/kk_trust_model.joblib
      SCORING_APPROVE_THRESHOLD: "0.8"
      SCORING_REVIEW_THRESHOLD: "0.5"
      PIPELINE_DRAIN_TIMEOUT_SECONDS: "30"
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi

service:
  type: ClusterIP
  annotations: {}
  # Service gabungan bernama `<release>` yang membuka port semua service ber-entrypoint (hanya
  # orchestrator, 8060). Ini alamat yang dipublikasikan ke Orkestrasi pusat (integration.md); internal
  # pipeline memakai Service per komponen.
  entrypoint:
    enabled: true

# Ingress default-deny untuk semua pod release; tiap service hanya menerima dari pemanggilnya
# (dihitung dari upstreams). Service ber-entrypoint menerima dari clientNamespaces dan dari semua
# pod release. Egress belum dibatasi. Cluster tanpa enforcement
# (GKE tanpa Dataplane V2 / Calico) mengabaikan policy ini diam-diam.
networkPolicy:
  enabled: true
  clientNamespaces: []

# maxUnavailable, bukan minAvailable: minAvailable 1 menahan upgrade node saat replika 1.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

serviceAccount:
  create: true
  name: ""
  # Workload Identity: iam.gke.io/gcp-service-account: <gsa>@<project>.iam.gserviceaccount.com
  annotations: {}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
