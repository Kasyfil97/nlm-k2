openapi: 3.1.0
info:
  title: 'nlm-k2 OCR Kartu Keluarga: gateway integration API'
  version: 1.0.0
  description: "Everything the central orchestrator / gateway needs to integrate the KK OCR pipeline,\
    \ merged from the\nservices' own specs. Each service also serves its full Swagger UI at `/docs`.\n\
    \n## The flow\n\n1. **`POST /v1/extract-ocr`** on the *orchestrator* service (port `8040`) with your\
    \ `request_id` and the\n   document (`file` or `file_url`). It answers in the central orchestrator's\n\
    \   `extract-ocr` contract (`data`, `guardrails`, `pipeline_last_stage`; the HTTP status says where\
    \ it is):\n   - rejected by the guardrails model -> **400**, `errors: DOWNSTREAM_VALIDATION_ERROR`,\
    \ `guardrails: 1`;\n     nothing runs and no callback follows.\n   - passed -> the document goes on\
    \ to the OCR stage and the service waits for the pipeline for up to\n     `PIPELINE_WAIT_SECONDS`\
    \ (30 s by default, counted from the request's arrival). Finished in time ->\n     **200**, `data`\
    \ = `no_kk`, `nama_kepala_keluarga` and `anggota_keluarga[]`\n     with seven fields per member, each\
    \ `{value, confidence}` and confidence 0/1; a stage failed ->\n     **422** `OCR_FAILED` / `STRUCTURING_FAILED`\
    \ / `SCORING_FAILED`; still\n     running -> **202**. Give this call an HTTP timeout well above the\
    \ wait.\n2. **Receive callbacks** (see *Webhooks*), sent by the pipeline stages themselves after a\
    \ hand-off. The\n   `SCORING` / `DONE` callback carries the **final result** (richer than `data`:\
    \ OCR scores, trust\n   probabilities, the guardrails report). A `FAILED` callback of any stage ends\
    \ the request.\n3. **Read the status when needed** with `GET /v1/extract-ocr/{request_id}` on the\
    \ same service: the same\n   contract, without waiting.\n\nTime a request out on your side: a stage\
    \ that crashes mid-job cannot send its callback.\n\n## What the result is, and is not\n\n`data` carries\
    \ **nine** fields: `no_kk`, `nama_kepala_keluarga`, and one object per household member\nwith `nama_lengkap`,\
    \ `nik`, `pendidikan`, `jenis_pekerjaan`, `status_hubungan_dalam_rumah_tangga`,\n`ayah`, `ibu`. Structuring\
    \ reads eleven document fields and fifteen per member; the rest stay behind\n`GET /v1/structuring/jobs/{request_id}`\
    \ rather than travelling to you. `value` is `\"\"` when a field\nwas not found, never null, and the\
    \ object is never replaced by null.\n\nEach field is `{value, confidence}`, as in nilam: `confidence`\
    \ is `1` when the ML team's\ntrust model's probability that the value is exactly correct reaches the\
    \ field's threshold, else `0`.\nThe threshold is yours per request (`column_confidence_threshold`),\
    \ else the one the model calibrated\nfor that field; a field the model has no threshold for (`no_kk`\
    \ today) is `0` unless you send one.\nThere is **no document-level score and no approve / reject decision**.\
    \ A member array is positional — member *n* in\n`data` is member *n* on the card.\n\n## Addresses\n\
    \nThe orchestrator is the only service you call. From another namespace in GKE:\n`http://nlm-k2.nlm-k2.svc.cluster.local:8040`\
    \ (the release's entry Service). The\nguardrails and pipeline stage services are internal. Nothing\
    \ is exposed outside the cluster.\n\n\n## Conventions (the same for every nlm-k2 service)\n\n**Authentication.**\
    \ Every endpoint except `/health`, `/ready` and `/metrics` requires the header `X-API-Key`.\nA missing\
    \ or wrong key answers `401`. The services are reachable only from inside the cluster.\n\n**Envelope.**\
    \ Every JSON response, success or error, has the same shape:\n`{status_code, status_desc, message,\
    \ data, errors, request_id}`. `status_code` always equals the HTTP\nstatus. On success `errors` is\
    \ null; on error `data` is null.\n\n**Errors.** `errors` is a stable, machine-readable code; branch\
    \ on it, not on the wording of `message`.\nThe document checks: `EMPTY_FILE`, `UNSUPPORTED_FILE_TYPE`,\
    \ `UNREADABLE_FILE`, `TOO_MANY_PAGES`,\n`INVALID_FILE_SOURCE`, `FILE_URL_REJECTED` (400), `FILE_TOO_LARGE`\
    \ (413). Otherwise the code of the status:\n`UNAUTHORIZED` (401), `REQUEST_ID_NOT_FOUND` (404, an\
    \ unknown request_id), `NOT_FOUND` (404, a path that does\nnot exist), `METHOD_NOT_ALLOWED` (405),\
    \ `VALIDATION_ERROR` (422), `TOO_MANY_REQUESTS` (429),\n`INTERNAL_SERVER_ERROR` (500), `DOWNSTREAM_UNAVAILABLE`\
    \ (503), `DOWNSTREAM_TIMEOUT` (504), unless an endpoint\ndocuments a more precise one. Every error\
    \ also names the service it comes from in `pipeline_last_stage`.\n`400` = the request or the document\
    \ is unusable (do not retry unchanged). `503` / `504` are safe to retry.\n\n**request_id.** Minted\
    \ by the central orchestrator and carried through every stage. Where an endpoint has\nno request_id\
    \ of its own, the `X-Request-ID` request header is used (and echoed in the response header);\nwithout\
    \ it the service generates one.\n\n**Asynchronous stages** (internal: only the orchestrator and the\
    \ previous stage call them). `POST\n.../jobs` answers `202` immediately and does the work in the background.\
    \ The outcome is reported by a\ncallback to the central orchestrator (see *Webhooks*), and can be\
    \ read at any time with\n`GET .../jobs/{request_id}`, which the orchestrator's `GET /v1/extract-ocr/{request_id}`\
    \ combines\nover the three stages. Submitting the same request_id again is idempotent:\n`202` with\
    \ `duplicate: true`, the work is not repeated, unless the earlier attempt `FAILED` or has been\n`PROCESSING`\
    \ for longer than the job lease (`PIPELINE_JOB_LEASE_SECONDS`, 5 minutes by default: the\nprocess\
    \ running it died). A job still running when the service shuts down is reported `FAILED`. Because\n\
    the request was already answered `202`, a problem with the document itself (unreadable file, no text,\n\
    unsupported document type) shows up as a `FAILED` job and callback, not as a `4xx`.\n"
tags:
- name: 1. Start the pipeline
  description: 'The call you make: guardrails check, then OCR -> structuring -> scoring, waited on for
    up to PIPELINE_WAIT_SECONDS; answers in the central orchestrator''s extract-ocr contract. 200: `completed`
    with the fields. 202: still `processing`, the result arrives by callback. 400: rejected. 422: a stage
    failed.'
- name: 2. Callbacks (you implement this)
  description: 'Listed under **Webhooks**: the request each stage sends to you when it finishes.'
- name: 3. Status
  description: 'Where a request is now, in the same contract, without waiting: e.g. after a 202 whose
    callback did not arrive.'
paths:
  /v1/extract-ocr:
    post:
      tags:
      - 1. Start the pipeline
      summary: Judge a document, run the pipeline, answer with the OCR result or 202
      description: '**The call the central orchestrator makes.** Checks the file, has the guardrails service
        judge it, hands it to the OCR stage when it passes, then waits for OCR -> structuring -> scoring
        for up to `PIPELINE_WAIT_SECONDS` (30 s by default), counted from when this request arrived. The
        response follows the central orchestrator''s `extract-ocr` contract ("Finished" meaning finished
        within the wait):


        | Outcome | HTTP | `data` | `guardrails` | `errors` | `pipeline_last_stage` |

        |---|---|---|---|---|---|

        | Finished | 200 | the fields | `0` | null | null |

        | Still running | 202 | null | null | null | null |

        | Rejected by the guardrails model | 400 | null | `1` | `DOWNSTREAM_VALIDATION_ERROR` | `guardrails`
        |

        | Rejected by the KK validity gate | 400 | null | `1` | `DOWNSTREAM_VALIDATION_ERROR` | `structuring`
        |

        | A stage failed | 422 | null | `0` | `OCR_FAILED`, `STRUCTURING_FAILED` or `SCORING_FAILED` |
        the service that failed |


        The HTTP status (also in `status_code`) says where the request is: 200 finished, 202 still running,
        4xx / 5xx failed or refused.


        `pipeline_last_stage` is null on a success answer (200, 202) and names the service an error comes
        from: a pipeline service as `pipeline_name_sequence` names it (`guardrails`, `extraction`, `structuring`,
        `scoring`), also on a 400 / 500 / 503 / 504 from calling one of them, or `orchestrator` when this
        service refused the request itself before calling any (API key, file checks, `pipeline_name_sequence`,
        thresholds, an unknown request_id).


        `data` holds NINE fields: `no_kk`, `nama_kepala_keluarga`, and `anggota_keluarga[]` with seven
        per member. Structuring extracts 11 document fields and 15 per member; only these leave, and the
        rest stay readable through `GET /v1/structuring/jobs/{request_id}`. Each is `{value, confidence}`,
        as in nilam: `value` is empty when not found -- never null -- and `confidence` is `1` when the
        trust model''s probability that the value is exactly correct reaches the field''s threshold, else
        `0`. The threshold is `column_confidence_threshold` for that field when sent, else the trust model''s
        own (the point above which every held-out sample of the field was correct); `no_kk` has none,
        so it is `0` unless the request gives it one. An unreadable threshold is `422` `INVALID_THRESHOLD`
        and nothing runs.


        **Rejected by the KK validity gate**: the only content gate in the pipeline, and it lives at structuring.
        Three rules, first match wins: no readable text boxes at all; the KK number missing; or no member
        with both a NIK and a name. `message` is the gate''s Indonesian reason. A rejected document is
        still a `DONE` job whose result stays readable at `GET /v1/structuring/jobs/{request_id}`.


        **Refused before anything runs** (plain error envelope, no `guardrails`): a document above `MAX_UPLOAD_BYTES`
        (5 MB by default) answers `413`, and a PDF with more than `MAX_DOCUMENT_PAGES` (2) pages answers
        `400`. Both carry an Indonesian `message` the client can show as is. JPEG, PNG and PDF are accepted;
        of a PDF only the first page is judged and read.


        **Which services run.** `pipeline_name_sequence` names them, in order, from `guardrails`, `extraction`,
        `structuring`, `scoring`: guardrails may be left out at the front and the end cut off, but nothing
        in the middle may be skipped and the order may not change (else `422` `INVALID_PIPELINE_SEQUENCE`
        and nothing runs). Omitted: all four. The last one ends the request and its result is `data`,
        as it is: the guardrails report, the OCR result, the structuring result, or the nine fields after
        scoring. Without `guardrails` the file checks above still run and the KK validity gate still rejects;
        the trust model gets no guardrails probability and works with that input missing.


        On 202 the result arrives by callback (sent by the pipeline stages), and can be read with `GET
        /v1/extract-ocr/{request_id}`. Give this call an HTTP timeout well above `PIPELINE_WAIT_SECONDS`
        (e.g. +15 s) to cover a slow guardrails check or hand-off.


        Send `request_id` plus the document as `file`, or as `file_url`; exactly one of the two. A `file_url`
        is downloaded here for the guardrails check, and the URL itself (not the bytes) is handed to the
        OCR stage, which downloads it again, also when it re-runs a job left behind by a dead process:
        the URL must stay valid for longer than the job lease. The raw guardrails report (`probability_bad`
        and the threshold it was compared against) is not part of this response: it travels down the pipeline
        and comes back in the SCORING callback.


        **Idempotency.** The same request_id again re-runs the guardrails check, but the pipeline does
        not run twice unless the earlier OCR attempt `FAILED` or outlived the job lease (`PIPELINE_JOB_LEASE_SECONDS`);
        a request_id that already finished answers again with its stored outcome.'
      operationId: extractOcr
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_extractOcr'
        required: true
      responses:
        '200':
          description: Accepted and finished within the wait
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              examples:
                completed:
                  summary: The OCR result
                  value:
                    status_code: 200
                    status_desc: OK
                    message: OCR extraction completed successfully
                    data:
                      no_kk:
                        value: '9901012609260001'
                        confidence: 1
                      nama_kepala_keluarga:
                        value: BUDI SANTOSO
                        confidence: 1
                      anggota_keluarga:
                      - nama_lengkap:
                          value: BUDI SANTOSO
                          confidence: 1
                        nik:
                          value: '9901011203850001'
                          confidence: 1
                        pendidikan:
                          value: S1
                          confidence: 1
                        jenis_pekerjaan:
                          value: KARYAWAN SWASTA
                          confidence: 1
                        status_hubungan_dalam_rumah_tangga:
                          value: KEPALA KELUARGA
                          confidence: 1
                        ayah:
                          value: SUTRISNO
                          confidence: 1
                        ibu:
                          value: SITI AMINAH
                          confidence: 0
                      - nama_lengkap:
                          value: SITI NURHALIZA
                          confidence: 0
                        nik:
                          value: '9901015506880002'
                          confidence: 1
                        pendidikan:
                          value: SLTA/SEDERAJAT
                          confidence: 0
                        jenis_pekerjaan:
                          value: MENGURUS RUMAH TANGGA
                          confidence: 0
                        status_hubungan_dalam_rumah_tangga:
                          value: ISTRI
                          confidence: 0
                        ayah:
                          value: AHMAD DAHLAN
                          confidence: 1
                        ibu:
                          value: RATNA SARI
                          confidence: 0
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                    guardrails: 0
        '202':
          description: 'Accepted, but still running when the wait ran out: the result follows by callback'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              examples:
                processing:
                  summary: Still processing
                  value:
                    status_code: 202
                    status_desc: Accepted
                    message: OCR job accepted; still processing
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
        '400':
          description: 'Rejected by the guardrails model or by the KK validity gate (`DOWNSTREAM_VALIDATION_ERROR`,
            `guardrails: 1`), a PDF above `MAX_DOCUMENT_PAGES` pages (`Jumlah halaman melebihi batas,
            pastikan hanya mengunggah foto Kartu Keluarga`), or a bad file / intake (empty, unsupported
            type, unreadable, `file_url` refused)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              example:
                status_code: 400
                status_desc: Bad Request
                message: Gambar terlalu buram untuk diproses, mohon unggah ulang foto Kartu Keluarga
                errors: DOWNSTREAM_VALIDATION_ERROR
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: guardrails
                guardrails: 1
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: UNAUTHORIZED
                pipeline_last_stage: orchestrator
        '429':
          description: The caller went over `RATE_LIMIT_REQUESTS` per `RATE_LIMIT_WINDOW_SECONDS`. `Retry-After`
            says how many seconds to wait. The limit is counted per API key, per process
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 429
                status_desc: Too Many Requests
                message: Terlalu banyak permintaan, silakan coba lagi beberapa saat lagi
                errors: TOO_MANY_REQUESTS
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: orchestrator
        '413':
          description: The document exceeds `MAX_UPLOAD_BYTES` (5 MB by default); nothing was started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 413
                status_desc: Payload Too Large
                message: Ukuran dokumen melebihi batas 5 MB, pastikan hanya mengunggah foto Kartu Keluarga
                errors: FILE_TOO_LARGE
                pipeline_last_stage: orchestrator
        '422':
          description: A pipeline stage failed within the wait (`OCR_FAILED`, `STRUCTURING_FAILED`, `SCORING_FAILED`;
            `message` says why), `pipeline_name_sequence` is not a valid sequence (`INVALID_PIPELINE_SEQUENCE`),
            a threshold cannot be read (`INVALID_THRESHOLD`), or a required field is missing (`VALIDATION_ERROR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'structuring stage failed: parser raised on an unexpected layout'
                errors: STRUCTURING_FAILED
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: structuring
                guardrails: 0
        '500':
          description: The guardrails or extraction service failed, or answered in an unexpected shape
            (`DOWNSTREAM_SERVER_ERROR`); `pipeline_last_stage` names it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              example:
                status_code: 500
                status_desc: Internal Server Error
                message: guardrails service returned an unexpected response
                errors: DOWNSTREAM_SERVER_ERROR
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: guardrails
        '503':
          description: The guardrails service, its model, or the extraction service is unreachable (`DOWNSTREAM_UNAVAILABLE`);
            nothing was started. `pipeline_last_stage` names it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              example:
                status_code: 503
                status_desc: Service Unavailable
                message: extraction service is unavailable
                errors: DOWNSTREAM_UNAVAILABLE
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: extraction
        '504':
          description: The guardrails service, its model, or the extraction service did not answer in
            time (`DOWNSTREAM_TIMEOUT`); `pipeline_last_stage` names it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              example:
                status_code: 504
                status_desc: Gateway Timeout
                message: extraction service timed out after 10.0s
                errors: DOWNSTREAM_TIMEOUT
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: extraction
      security:
      - APIKeyHeader: []
      servers: &id001
      - url: http://nlm-k2.{namespace}.svc.cluster.local:8040
        description: 'GKE, from another namespace: the entry Service (the central orchestrator / gateway)'
        variables:
          namespace:
            default: nlm-k2
            description: 'Namespace of the Helm release (deploy/helm/deploy.sh: nlm-k2)'
      - url: http://nlm-k2-orchestrator.{namespace}.svc.cluster.local:8040
        description: GKE, from inside the release's namespace (the other services of this pipeline)
        variables:
          namespace:
            default: nlm-k2
            description: 'Namespace of the Helm release (deploy/helm/deploy.sh: nlm-k2)'
      - url: http://orchestrator:8040
        description: The Docker Compose network
      - url: http://127.0.0.1:8040
        description: Local development
  /v1/extract-ocr/{request_id}:
    get:
      tags:
      - 3. Status
      summary: 'Where a request is now: the extract-ocr answer, without waiting'
      description: 'Reads the jobs of `request_id` once each, in pipeline order, up to the last service
        of the `pipeline_name_sequence` stored with its extraction job, and answers in the same contract
        as `POST /v1/extract-ocr` ("Finished" meaning finished by now):


        | Outcome | HTTP | `data` | `guardrails` | `errors` | `pipeline_last_stage` |

        |---|---|---|---|---|---|

        | Finished | 200 | the fields | `0` | null | null |

        | Still running | 202 | null | null | null | null |

        | Rejected by the guardrails model | 400 | null | `1` | `DOWNSTREAM_VALIDATION_ERROR` | `guardrails`
        |

        | Rejected by the KK validity gate | 400 | null | `1` | `DOWNSTREAM_VALIDATION_ERROR` | `structuring`
        |

        | A stage failed | 422 | null | `0` | `OCR_FAILED`, `STRUCTURING_FAILED` or `SCORING_FAILED` |
        the service that failed |


        The HTTP status (also in `status_code`) says where the request is: 200 finished, 202 still running,
        4xx / 5xx failed or refused.


        `pipeline_last_stage` is null on a success answer (200, 202) and names the service an error comes
        from: a pipeline service as `pipeline_name_sequence` names it (`guardrails`, `extraction`, `structuring`,
        `scoring`), also on a 400 / 500 / 503 / 504 from calling one of them, or `orchestrator` when this
        service refused the request itself before calling any (API key, file checks, `pipeline_name_sequence`,
        thresholds, an unknown request_id).


        Use it for a request that was answered `202`, e.g. when a callback did not arrive.


        **No stage job.** A request that never reached a stage is answered from its last guardrails verdict
        (`nilam_guardrails_results`), as its POST was: `400` when guardrails rejected it, `200` with the
        report as `data` when guardrails was its only service. **404** otherwise: refused before the check,
        still being judged, passed but its hand-off to extraction failed, or no verdict kept (no `DATABASE_URL`).


        **Limitation.** A hand-off between two stages that failed for good (its retries ran out, or it
        became a dead letter in the outbox) leaves the next stage without a job, so this endpoint keeps
        answering `202` for it. The `FAILED` callback and the central orchestrator''s own tables carry
        that final state; this endpoint only reads the stages'' jobs.'
      operationId: getExtractOcr
      security:
      - APIKeyHeader: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      responses:
        '200':
          description: Finished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              examples:
                completed:
                  summary: The OCR result
                  value:
                    status_code: 200
                    status_desc: OK
                    message: OCR extraction completed successfully
                    data:
                      no_kk:
                        value: '9901012609260001'
                        confidence: 1
                      nama_kepala_keluarga:
                        value: BUDI SANTOSO
                        confidence: 1
                      anggota_keluarga:
                      - nama_lengkap:
                          value: BUDI SANTOSO
                          confidence: 1
                        nik:
                          value: '9901011203850001'
                          confidence: 1
                        pendidikan:
                          value: S1
                          confidence: 1
                        jenis_pekerjaan:
                          value: KARYAWAN SWASTA
                          confidence: 1
                        status_hubungan_dalam_rumah_tangga:
                          value: KEPALA KELUARGA
                          confidence: 1
                        ayah:
                          value: SUTRISNO
                          confidence: 1
                        ibu:
                          value: SITI AMINAH
                          confidence: 0
                      - nama_lengkap:
                          value: SITI NURHALIZA
                          confidence: 0
                        nik:
                          value: '9901015506880002'
                          confidence: 1
                        pendidikan:
                          value: SLTA/SEDERAJAT
                          confidence: 0
                        jenis_pekerjaan:
                          value: MENGURUS RUMAH TANGGA
                          confidence: 0
                        status_hubungan_dalam_rumah_tangga:
                          value: ISTRI
                          confidence: 0
                        ayah:
                          value: AHMAD DAHLAN
                          confidence: 1
                        ibu:
                          value: RATNA SARI
                          confidence: 0
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                    guardrails: 0
        '202':
          description: Still running
          content:
            application/json:
              examples:
                processing:
                  summary: Still processing
                  value:
                    status_code: 202
                    status_desc: Accepted
                    message: OCR job accepted; still processing
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
        '400':
          description: 'Rejected by the KK validity gate or, read from nilam_guardrails_results, by the
            guardrails model (`DOWNSTREAM_VALIDATION_ERROR`, `guardrails: 1`)'
          content:
            application/json:
              example:
                status_code: 400
                status_desc: Bad Request
                message: Dokumen tidak dikenali sebagai Kartu Keluarga atau hasil extraction tidak lengkap
                errors: DOWNSTREAM_VALIDATION_ERROR
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: guardrails
                guardrails: 1
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: UNAUTHORIZED
                pipeline_last_stage: orchestrator
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: The caller went over `RATE_LIMIT_REQUESTS` per `RATE_LIMIT_WINDOW_SECONDS`. `Retry-After`
            says how many seconds to wait. The limit is counted per API key, per process
          content:
            application/json:
              example:
                status_code: 429
                status_desc: Too Many Requests
                message: Terlalu banyak permintaan, silakan coba lagi beberapa saat lagi
                errors: TOO_MANY_REQUESTS
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: orchestrator
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No stage has a job for this request_id and no guardrails verdict answers for it
            (not submitted yet, refused before the check, or its hand-off to extraction failed)
          content:
            application/json:
              example:
                status_code: 404
                status_desc: Not Found
                message: No request found for request_id OCR_9cb01af2-493d-446d-b191-af120333f6d0
                errors: REQUEST_ID_NOT_FOUND
                pipeline_last_stage: orchestrator
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: A pipeline stage failed (`OCR_FAILED`, `STRUCTURING_FAILED`, `SCORING_FAILED`)
          content:
            application/json:
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'structuring stage failed: parser raised on an unexpected layout'
                errors: STRUCTURING_FAILED
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: structuring
                guardrails: 0
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
        '500':
          description: A stage answered in an unexpected shape, or refused this service (e.g. a wrong
            API key)
          content:
            application/json:
              example:
                status_code: 500
                status_desc: Internal Server Error
                message: 'structuring service error (401): Invalid or missing API key'
                errors: DOWNSTREAM_SERVER_ERROR
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: structuring
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
        '503':
          description: A stage service is unreachable
          content:
            application/json:
              example:
                status_code: 503
                status_desc: Service Unavailable
                message: structuring service is unavailable
                errors: DOWNSTREAM_UNAVAILABLE
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: structuring
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
        '504':
          description: A stage service did not answer in time
          content:
            application/json:
              example:
                status_code: 504
                status_desc: Gateway Timeout
                message: structuring service timed out after 10.0s
                errors: DOWNSTREAM_TIMEOUT
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: structuring
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
      servers: *id001
webhooks:
  stageCallback:
    post:
      tags:
      - 2. Callbacks (you implement this)
      summary: Stage status callback (implemented by the orchestrator / gateway)
      description: '**This is a request this service SENDS, not one it accepts.** The orchestrator must
        expose it.


        `POST {ORCHESTRATION_URL}{ORCHESTRATION_CALLBACK_PATH}` (default path `/v1/callbacks/stage`),
        `Content-Type: application/json`.


        **When.** Once per stage, from the service that ran it:


        - **extraction**: Once per job of `POST /v1/extraction/jobs`: `stage: OCR` with `status: DONE`
        once the OCR result is stored, or `status: FAILED` with `error_message` when the document could
        not be read (the chain stops there). An image with no readable text is `DONE`, not `FAILED`: it
        is rejected by the structuring rules. Additionally `stage: STRUCTURING`, `status: FAILED` when
        OCR succeeded but the structuring service could not be reached after retries. Without `PIPELINE_OUTBOX`
        the `OCR` callback is sent before the hand-off to structuring; with it the hand-off goes first,
        so the `STRUCTURING` callback may arrive before this one.

        - **structuring**: Once per job of `POST /v1/structuring/jobs`: `stage: STRUCTURING` with `status:
        DONE` once the fields are stored, or `status: FAILED` with `error_message` when the upload is
        not a lone KK card or has no text (the chain stops there). Additionally `stage: SCORING`, `status:
        FAILED` when structuring succeeded but the scoring service could not be reached after retries.
        Without `PIPELINE_OUTBOX` the `STRUCTURING` callback is sent before the hand-off to scoring; with
        it the hand-off goes first, so the `SCORING` callback may arrive before this one.

        - **scoring**: Once per job of `POST /v1/scoring/jobs`, the last callback of a request: `stage:
        SCORING` with `status: DONE` and `result` = the **final result** (fields, per-field confidences,
        and the guardrails result that was submitted), or `status: FAILED` with `error_message` and `result:
        null`.


        **Expected answer.** Any `2xx`; the body is ignored. `5xx`, a timeout or an unreachable host are
        retried (3 attempts by default, exponential back-off from 0.5 s). A `4xx` is NOT retried. A callback
        that still fails is logged and dropped: the job itself stays `DONE` / `FAILED`, so the orchestrator
        can reconcile with its own `GET /v1/extract-ocr/{request_id}` and should time a request out on
        its own. With `PIPELINE_OUTBOX` the callback is instead queued in the same transaction as the
        result and retried with back-off (up to 5 minutes apart) for up to `PIPELINE_OUTBOX_MAX_AGE_SECONDS`
        (24 h by default); a `4xx`, or that age, makes it a dead letter that stays in the table and is
        counted by `GET .../outbox`.


        **What the receiver must tolerate.** The same callback may arrive more than once (treat it as
        idempotent), and callbacks of different stages come from different services, so they may arrive
        out of order: only ever move a request''s status forward. Reject callbacks whose `X-API-Key` is
        wrong.'
      operationId: stageCallback
      parameters:
      - description: '`ORCHESTRATION_API_KEY` of the sending service; when unset, that service''s own
          `API_KEY`'
        required: true
        schema:
          type: string
          title: X-Api-Key
          description: '`ORCHESTRATION_API_KEY` of the sending service; when unset, that service''s own
            `API_KEY`'
        name: x-api-key
        in: header
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/StageCallback'
              - $ref: '#/components/schemas/ScoringStageCallback'
              description: '`stage: SCORING` carries the final result in `result`; for the other stages
                `result` is null.'
        required: true
      responses:
        '200':
          description: Acknowledged. Any 2xx is accepted and the body is ignored.
          content:
            application/json:
              schema: {}
components:
  schemas:
    Body_extractOcr:
      properties:
        request_id:
          type: string
          title: Request Id
          description: request_id minted by the central orchestrator
          examples:
          - OCR_9cb01af2-493d-446d-b191-af120333f6d0
        file:
          anyOf:
          - type: string
            format: binary
          - type: string
          - type: 'null'
          title: File
          description: Kartu Keluarga photo (JPEG, PNG or PDF; of a PDF only page 1 is read). Omit when
            sending file_url.
        file_url:
          anyOf:
          - type: string
          - type: 'null'
          title: File Url
          description: 'URL this service fetches the photo from (e.g. a presigned MinIO GET). Omit when
            uploading file. The host must be listed in the service''s `FILE_URL_ALLOWED_HOSTS`: an EMPTY
            list denies every URL rather than allowing public ones. https only, redirects are not followed,
            and a host that resolves to a private or loopback address is refused even when it is listed.'
        pipeline_name_sequence:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Pipeline Name Sequence
          description: 'The services to run, in order: `guardrails`, `extraction`, `structuring`, `scoring`;
            guardrails optional at the front, the end may be cut off, nothing skipped in the middle. Repeated
            form fields, a comma-separated string, or one JSON array string. Omitted or blank: all four.
            The last one''s result is `data`, as it is'
          examples:
          - - guardrails
            - extraction
            - structuring
            - scoring
        guardrails_confidence_threshold:
          anyOf:
          - type: string
          - type: 'null'
          title: Guardrails Confidence Threshold
          description: 'Guardrails threshold for this document, a JSON object string `{"acc_rej": 0.8}`
            with the value between 0 and 1 (exclusive). Applies to the rejected side. Omitted: no threshold
            applies -- the document passes guardrails and its `probability_bad` travels on to scoring'
          examples:
          - '{"acc_rej": 0.8}'
        column_confidence_threshold:
          anyOf:
          - type: string
          - type: 'null'
          title: Column Confidence Threshold
          description: 'Per field, from the central orchestrator: the trust model''s probability that
            the field''s value is correct must reach it for the field''s `confidence` to be `1` (else
            `0`). Keys are the contract names: `no_kk`, `nama_kepala_keluarga`, and the seven member fields
            (`nama_lengkap`, `nik`, `pendidikan`, `jenis_pekerjaan`, `status_hubungan_dalam_rumah_tangga`,
            `ayah`, `ibu`), a member field''s threshold applying to every member. `all_field` sets one
            threshold for every field; a key for a single field overrides it. A field without a threshold
            (left out, or the whole map omitted) gets the trust model''s probability itself as `confidence`,
            a float from 0 to 1 (0 when there is no value). A JSON object string'
          examples:
          - '{"all_field": 0.8}'
      type: object
      required:
      - request_id
      title: Body_extractOcr
    ContractField:
      properties:
        value:
          type: string
          title: Value
          description: The value read; `""` when the field was not found -- never null, and the object
            itself is never replaced by null
          default: ''
          examples:
          - '3273012345678901'
        confidence:
          anyOf:
          - type: integer
          - type: number
          title: Confidence
          description: 'With a threshold for this field in the request''s `column_confidence_threshold`
            (its own key or `all_field`): 1 when the trust model''s probability that this value is exactly
            correct reaches it, else 0 (also when there is no value), as in nilam. **Without a threshold**:
            that probability itself, a float from 0 to 1 as the model gave it (0 when there is no value)'
          examples:
          - 1
          - 0.9731
          ge: 0
          le: 1
      type: object
      required:
      - confidence
      title: ContractField
    ErrorResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          examples:
          - 400
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          examples:
          - Bad Request
        message:
          type: string
          title: Message
          description: Human-readable cause; safe to log
          examples:
          - Uploaded file is empty
        data:
          type: 'null'
          title: Data
          description: Always null on error
        errors:
          type: string
          title: Errors
          description: 'Stable, machine-readable cause (e.g. `EMPTY_FILE`, `UNAUTHORIZED`, `VALIDATION_ERROR`):
            branch on this, never on the wording of `message`'
          examples:
          - EMPTY_FILE
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: Present when the error is tied to a known request_id
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        pipeline_last_stage:
          anyOf:
          - type: string
          - type: 'null'
          title: Pipeline Last Stage
          description: 'The service the error comes from: this one (`orchestrator`, `guardrails`, `extraction`,
            `structuring`, `scoring`), or the pipeline service it called when that one failed'
          examples:
          - orchestrator
      type: object
      required:
      - status_code
      - status_desc
      - message
      - errors
      title: ErrorResponse
      description: Every error response.
    ExtractOcrResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          examples:
          - 200
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          examples:
          - OK
        message:
          type: string
          title: Message
          description: Human-readable; its wording may change, so branch on `errors` instead
          examples:
          - OCR extraction completed successfully
        data:
          anyOf:
          - $ref: '#/components/schemas/KkData'
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Data
          description: The result on 200 (finished); null otherwise. The nine fields when scoring ended
            the request; the result of the last service of `pipeline_name_sequence`, as it is, when the
            sequence ends earlier (the guardrails report, the OCR result, or the structuring result)
        errors:
          anyOf:
          - type: string
          - type: 'null'
          title: Errors
          description: Failure code when the request failed or was refused; null otherwise
          examples:
          - null
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: The request_id this response belongs to
        pipeline_last_stage:
          anyOf:
          - type: string
            enum:
            - orchestrator
            - guardrails
            - extraction
            - structuring
            - scoring
          - type: 'null'
          title: Pipeline Last Stage
          description: 'Null on a success answer (200 finished, 202 still running). On an error, the service
            it comes from, named as in `pipeline_name_sequence`: the one that rejected (`guardrails`,
            `structuring`) or failed; the one that could not be reached or answered an error. `orchestrator`
            when this service refused the request itself before calling any pipeline service (file checks,
            `pipeline_name_sequence`, thresholds, `document_type`, an unknown request_id)'
          examples:
          - structuring
        guardrails:
          anyOf:
          - type: integer
            enum:
            - 0
            - 1
          - type: 'null'
          title: Guardrails
          description: '0: the document passed the guardrails model (and the pipeline ran); 1: it was
            rejected by the guardrails model or by the KK validity gate. Null on 202, and when the request
            was refused before the check'
          examples:
          - 0
      type: object
      required:
      - status_code
      - status_desc
      - message
      title: ExtractOcrResponse
    FinalResult:
      properties:
        document_type:
          type: string
          title: Document Type
          description: Document type the fields were read as
          examples:
          - kk
        structuring:
          $ref: '#/components/schemas/StructuringPayload'
          description: 'The structuring result whole: all 11 document fields and 15 per member'
        scoring:
          $ref: '#/components/schemas/ScoringPayload'
          description: 'Per-field trust for the nine contract fields. There is NO document-level score
            and NO approve / reject decision: thresholds belong to the caller'
        guardrails:
          anyOf:
          - $ref: '#/components/schemas/GuardrailsResult'
          - type: 'null'
          description: The guardrails result that was submitted with the job, returned unchanged
      additionalProperties: true
      type: object
      required:
      - document_type
      - structuring
      - scoring
      title: FinalResult
      description: What the pipeline produced for one request_id. Carried by the SCORING / DONE callback.
    GuardrailsDocument:
      properties:
        verdict:
          anyOf:
          - type: string
            enum:
            - accepted
            - reject
            - unassessable
          - type: 'null'
          title: Verdict
          description: Document verdict
          examples:
          - accepted
        confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Confidence
          description: 'Confidence in the verdict: `probability_bad` when rejected, `1 - probability_bad`
            when accepted. Null when the image could not be assessed'
          examples:
          - 0.9713
        probability_bad:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Probability Bad
          description: Raw model output. Travels unchanged to scoring as the `guardrail_probability` feature.
            Null when `verdict` is `unassessable`, which scoring must handle rather than assume a number
          examples:
          - 0.0287
        threshold_used:
          anyOf:
          - type: number
            exclusiveMaximum: 1.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Threshold Used
          description: The threshold in force at the moment of the judgement. Echoed because it can be
            changed at the central orchestrator without a deploy here, so the verdict records the one
            it actually used
          examples:
          - 0.5
        threshold_target:
          anyOf:
          - type: string
            enum:
            - accept
            - reject
          - type: 'null'
          title: Threshold Target
          description: 'The side `threshold_used` applied to: `reject` (the default) or `accept` (on 1
            - probability_bad)'
          examples:
          - reject
      additionalProperties: true
      type: object
      title: GuardrailsDocument
      description: 'The guardrails verdict. A Kartu Keluarga is always a single image, so there is no
        page

        concept here and no aggregation across pages.'
    GuardrailsResult:
      properties:
        passed:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Passed
          description: 'true: the document may proceed to OCR'
          examples:
          - true
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Why it was rejected, in Indonesian; null when passed
          examples:
          - null
        document:
          anyOf:
          - $ref: '#/components/schemas/GuardrailsDocument'
          - type: 'null'
          description: The verdict and its numbers
      additionalProperties: true
      type: object
      title: GuardrailsResult
      description: The guardrails report (`data` of the guardrails service's POST /v1/guardrails/check,
        sent on by the orchestrator), forwarded unchanged down the pipeline.
    KkData:
      properties:
        no_kk:
          $ref: '#/components/schemas/ContractField'
          description: The 16-digit KK number
        nama_kepala_keluarga:
          $ref: '#/components/schemas/ContractField'
          description: Name of the head of the household
        anggota_keluarga:
          items:
            $ref: '#/components/schemas/KkMember'
          type: array
          title: Anggota Keluarga
          description: One entry per member, in the order printed on the card; may be empty
      type: object
      required:
      - no_kk
      - nama_kepala_keluarga
      - anggota_keluarga
      title: KkData
      description: '`data` of a completed request: nine fields, and nothing else.


        Structuring extracts 11 document fields and 15 per member; only these leave. The rest stay in

        `nilam_structuring_results` and are readable through `GET /v1/structuring/jobs/{request_id}`.'
    KkMember:
      properties:
        nama_lengkap:
          $ref: '#/components/schemas/ContractField'
        nik:
          $ref: '#/components/schemas/ContractField'
        pendidikan:
          $ref: '#/components/schemas/ContractField'
        jenis_pekerjaan:
          $ref: '#/components/schemas/ContractField'
        status_hubungan_dalam_rumah_tangga:
          $ref: '#/components/schemas/ContractField'
          description: The card itself prints STATUS HUBUNGAN DALAM KELUARGA; this contract says `...dalam_rumah_tangga`
            because the consumer asked for it. Internally the field keeps the card's name -- one of only
            two keys the projection renames
        ayah:
          $ref: '#/components/schemas/ContractField'
        ibu:
          $ref: '#/components/schemas/ContractField'
      type: object
      required:
      - nama_lengkap
      - nik
      - pendidikan
      - jenis_pekerjaan
      - status_hubungan_dalam_rumah_tangga
      - ayah
      - ibu
      title: KkMember
      description: One row of `anggota_keluarga`. All seven keys are always present.
    ScoringPayload:
      properties:
        document_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Type
          description: Document type the fields were read as
          examples:
          - kk
        fields:
          additionalProperties:
            anyOf:
            - type: number
            - type: 'null'
          type: object
          title: Fields
          description: '`nomor_kk` and `nama_kepala_keluarga`. Null for a field whose value is empty'
          examples:
          - nama_kepala_keluarga: 0.8871
            nomor_kk: 0.9412
        anggota_keluarga:
          items:
            additionalProperties:
              anyOf:
              - type: number
              - type: 'null'
            type: object
          type: array
          title: Anggota Keluarga
          description: Seven scores per member, positionally aligned with the structuring result. A length
            mismatch is a defect in this pipeline, not a property of the document, and is rejected rather
            than truncated
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
          description: Identity of the trust model
          examples:
          - kk-trust-isotonic-v1
        payload:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Payload
          description: Exactly what was scored, as an audit trail, so the numbers can be reproduced
        thresholds:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Thresholds
          description: 'The confidence above which a field of that name was correct on every held-out
            sample -- one per scored field, keyed by INTERNAL name. They travel in the result rather than
            in configuration because they are a property of the trained model, not of the deployment,
            and because this is what makes them auditable next to the scores. For reference only: they
            no longer decide a field''s `confidence`; only the request''s `column_confidence_threshold`
            does'
          examples:
          - ayah: 0.9353
            nik: 0.9637
            pendidikan: 0.9929
        bin_edges:
          anyOf:
          - additionalProperties:
              items:
                type: number
              type: array
            type: object
          - type: 'null'
          title: Bin Edges
          description: 'Bin boundaries low to high, under `fields` and `anggota_keluarga` -- the two model
            families have their own. Deliberately NOT equal width: the top bin is cut exactly where held-out
            precision reached 100%, which no fixed grid lands on. Kept for audit; the contract no longer
            carries a bin'
          examples:
          - anggota_keluarga:
            - 0.0
            - 0.631
            - 0.776
            - 0.839
            - 0.899
            - 0.925
            - 0.943
            - 0.965
            - 0.979
            - 0.9874
            - 1.0
        decisions:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Decisions
          description: 'The decision per CONTRACT field, with the threshold that decided it: `{no_kk:
            {value, confidence, threshold}, nama_kepala_keluarga: {...}, anggota_keluarga: [{...}]}`.
            The outcome row and the `extract-ocr` answer are projected from it, so both say the same for
            one request. `confidence` is 0/1 against `threshold`; `threshold` null: the request gave the
            field no threshold, so `confidence` is the trust model''s probability itself (a float, 0 without
            a value)'
      additionalProperties: true
      type: object
      title: ScoringPayload
      description: 'Trust model output: P(each extracted field is correct), fused and calibrated.'
    ScoringStageCallback:
      properties:
        request_id:
          type: string
          title: Request Id
          description: The request_id you submitted with `POST /v1/extraction/jobs`
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        stage:
          type: string
          const: SCORING
          title: Stage
          description: 'Always `SCORING`: the last stage'
          default: SCORING
          examples:
          - SCORING
        status:
          type: string
          enum:
          - DONE
          - FAILED
          title: Status
          description: Outcome of the stage. `FAILED` of any stage ends the request
          examples:
          - DONE
        result:
          anyOf:
          - $ref: '#/components/schemas/FinalResult'
          - type: 'null'
          description: The final result of the request when `status` is `DONE`; null when `FAILED`
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
          description: Why it failed; null when `status` is `DONE`
          examples:
          - null
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
          description: 'Only on a rejection: `DOWNSTREAM_VALIDATION_ERROR` when the KK validity gate rejected
            the document (`error_message` is the Indonesian reason). Absent when a stage broke'
          examples:
          - null
      type: object
      required:
      - request_id
      - status
      title: ScoringStageCallback
      description: Body of the callback a stage POSTs to the orchestrator when it finishes.
    StageCallback:
      properties:
        request_id:
          type: string
          title: Request Id
          description: The request_id you submitted with `POST /v1/extraction/jobs`
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        stage:
          type: string
          enum:
          - OCR
          - STRUCTURING
          - SCORING
          title: Stage
          description: 'Stage the status is about. Usually the sender''s own stage; when the hand-off
            to the NEXT stage fails after retries, the sender reports `status: FAILED` with the next stage''s
            name, because that stage never received the job and cannot report for itself'
          examples:
          - OCR
        status:
          type: string
          enum:
          - DONE
          - FAILED
          title: Status
          description: Outcome of the stage. `FAILED` of any stage ends the request
          examples:
          - DONE
        result:
          type: 'null'
          title: Result
          description: Always null for OCR and STRUCTURING; read the stage result from GET .../jobs/{request_id}
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
          description: Why it failed; null when `status` is `DONE`
          examples:
          - null
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
          description: 'Only on a rejection: `DOWNSTREAM_VALIDATION_ERROR` when the KK validity gate rejected
            the document (`error_message` is the Indonesian reason). Absent when a stage broke'
          examples:
          - null
      type: object
      required:
      - request_id
      - stage
      - status
      title: StageCallback
      description: Body of the callback a stage POSTs to the orchestrator when it finishes.
    StructuredFieldPayload:
      properties:
        value:
          type: string
          title: Value
          description: The value; `""` when not found -- never null
          default: ''
          examples:
          - '3273012345678901'
        ocr_conf:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Ocr Conf
          description: Lowest recognition score among the OCR boxes that formed this value; null when
            not found
          examples:
          - 0.9991
        crf_conf:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Crf Conf
          description: 'How sure structuring is that the text belongs in this field: with `kk_model`,
            the lowest box-class probability of the field''s boxes; with `kk_regex`, the forward-backward
            marginal of the column placement. ALWAYS null for document fields, and null for a member field
            that was not found'
          examples:
          - null
        features:
          anyOf:
          - additionalProperties:
              anyOf:
              - type: number
              - type: 'null'
            type: object
          - type: 'null'
          title: Features
          description: 'The trust model''s input vector for this field; null when the field is empty,
            and a single feature is null when it came out non-finite (`kk_field` then scores the field
            null). It exists because the two scores above do not separate a correct value from a wrong
            one: over 1686 hand-labelled cells `crf_conf` scores AUC 0.502, no better than a coin, while
            the parser internals that do carry the signal are computed and then discarded. Names are pinned
            by `kk.FIELD_FEATURES` (42, the same for every field, from `kk_model`) or by `kk.MEMBER_CELL_FEATURES`
            / `kk.DOC_CELL_FEATURES` (from `kk_regex`); scoring assembles them and never recomputes one,
            because the same feature computed in two places is how a model ends up good in training and
            bad in production'
          examples:
          - emis_assigned_min: 0.0
            lebar_rel: 0.87
            marg_min: 0.9967
            margin_min: 0.9934
      additionalProperties: true
      type: object
      title: StructuredFieldPayload
      description: One named field read by structuring, carrying two scores that are deliberately not
        fused.
    StructuredMemberPayload:
      properties:
        nama_lengkap:
          $ref: '#/components/schemas/StructuredFieldPayload'
        nik:
          $ref: '#/components/schemas/StructuredFieldPayload'
        pendidikan:
          $ref: '#/components/schemas/StructuredFieldPayload'
        jenis_pekerjaan:
          $ref: '#/components/schemas/StructuredFieldPayload'
        status_hubungan_dalam_keluarga:
          $ref: '#/components/schemas/StructuredFieldPayload'
        ayah:
          $ref: '#/components/schemas/StructuredFieldPayload'
        ibu:
          $ref: '#/components/schemas/StructuredFieldPayload'
      additionalProperties: true
      type: object
      required:
      - nama_lengkap
      - nik
      - pendidikan
      - jenis_pekerjaan
      - status_hubungan_dalam_keluarga
      - ayah
      - ibu
      title: StructuredMemberPayload
      description: One row of `anggota_keluarga`. All seven keys are always present, even when empty.
    StructuringPayload:
      properties:
        nomor_kk:
          $ref: '#/components/schemas/StructuredFieldPayload'
          description: 'The KK number. Note `nomor_kk`, not `no_kk`: the rename happens in the orchestrator'
        nama_kepala_keluarga:
          $ref: '#/components/schemas/StructuredFieldPayload'
        anggota_keluarga:
          items:
            $ref: '#/components/schemas/StructuredMemberPayload'
          type: array
          title: Anggota Keluarga
          description: One entry per row on the card, in card order. May be empty, which the validity
            gate rejects
        reject_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reject Reason
          description: The first rejecting rule of the KK validity gate, in Indonesian; null when accepted.
            It lives in this payload rather than only in the outcome row because the orchestrator is stateless
            and reads stages through their API -- a reason kept elsewhere could never become the client's
            400
          examples:
          - null
      additionalProperties: true
      type: object
      required:
      - nomor_kk
      - nama_kepala_keluarga
      title: StructuringPayload
      description: Result of the structuring stage (`nilam_structuring_results`), forwarded to scoring.
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: API key for this service
      in: header
      name: X-API-Key
