# Docker Compose untuk deployment di VM (bukan GKE).
#
# Perbedaan dari docker-compose.yml (lokal):
#   - Membaca services/<nama>/.env (produksi), bukan .env.local
#   - Tanpa container Postgres lokal — service terhubung ke Cloud SQL lewat connector
#   - Menambahkan akses ke metadata server GCP (169.254.169.254) supaya ADC bekerja
#     dari dalam container untuk IAM database authentication dan GCS pull weights
#   - Port di-bind ke 0.0.0.0 (semua interface) agar bisa diakses dari luar VM
#
# Prasyarat di VM:
#   1. Service account VM punya role Cloud SQL Client + Storage Object Viewer
#   2. Image sudah dibangun: docker compose -f docker-compose.vm.yml build
#   3. Migrasi DB sudah dijalankan sebelum services pertama kali naik
#
# Jalankan:
#   docker compose -f docker-compose.vm.yml up -d
#   docker compose -f docker-compose.vm.yml ps
#   docker compose -f docker-compose.vm.yml logs -f orchestrator

x-common: &common
  restart: unless-stopped
  extra_hosts:
    # Metadata server GCP untuk Application Default Credentials (IAM auth Cloud SQL & GCS).
    - "metadata.google.internal:169.254.169.254"

services:
  orchestrator:
    <<: *common
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    image: nlm-k2-orchestrator:latest
    env_file: services/orchestrator/.env
    environment:
      PORT: "8060"
      GUARDRAILS_SERVICE_URL: http://guardrails:8061
      EXTRACTION_SERVICE_URL: http://extraction:8062
      STRUCTURING_SERVICE_URL: http://structuring:8063
      SCORING_SERVICE_URL: http://scoring:8064
    ports:
      - "0.0.0.0:${ORCHESTRATOR_HOST_PORT:-8060}:8060"
    depends_on:
      - guardrails
      - extraction

  guardrails:
    <<: *common
    build:
      context: .
      dockerfile: services/guardrails/Dockerfile
    image: nlm-k2-guardrails:latest
    env_file: services/guardrails/.env
    environment:
      PORT: "8061"
    ports:
      - "127.0.0.1:${GUARDRAILS_HOST_PORT:-8061}:8061"

  extraction:
    <<: *common
    build:
      context: .
      dockerfile: services/extraction/Dockerfile
    image: nlm-k2-extraction:latest
    env_file: services/extraction/.env
    environment:
      PORT: "8062"
      STRUCTURING_SERVICE_URL: http://structuring:8063
    ports:
      - "127.0.0.1:${EXTRACTION_HOST_PORT:-8062}:8062"
    depends_on:
      - structuring

  structuring:
    <<: *common
    build:
      context: .
      dockerfile: services/structuring/Dockerfile
    image: nlm-k2-structuring:latest
    env_file: services/structuring/.env
    environment:
      PORT: "8063"
      SCORING_SERVICE_URL: http://scoring:8064
    ports:
      - "127.0.0.1:${STRUCTURING_HOST_PORT:-8063}:8063"
    depends_on:
      - scoring

  scoring:
    <<: *common
    build:
      context: .
      dockerfile: services/scoring/Dockerfile
    image: nlm-k2-scoring:latest
    env_file: services/scoring/.env
    environment:
      PORT: "8064"
    ports:
      - "127.0.0.1:${SCORING_HOST_PORT:-8064}:8064"

  # Migrasi DB (alembic) — image khusus db/Dockerfile, satu-satunya yang memuat alembic + folder db/.
  # Profile "migrate" supaya TIDAK ikut `docker compose up`. Dijalankan via deploy/vm/migrate-vm.sh.
  # DATABASE_URL dibaca dari services/extraction/.env (env_file), jadi tidak di-source di shell.
  migrate:
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: db/Dockerfile
    image: nlm-k2-migrate:latest
    env_file: services/extraction/.env

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
